var currentChapter=0,answered=0,correct=0;

function switchChapter(index){currentChapter=parseInt(index);answered=0;correct=0;renderChapter();document.getElementById('chapterSelect').value=currentChapter;}
function prevChapter(){if(currentChapter>0)switchChapter(currentChapter-1);}
function nextChapter(){if(currentChapter<chapters.length-1)switchChapter(currentChapter+1);}
function updateNavButtons(){document.getElementById('prevBtn').disabled=(currentChapter===0);document.getElementById('nextBtn').disabled=(currentChapter===chapters.length-1);}
var currentQuestionIndex=0;
function renderChapter(){var ch=chapters[currentChapter];document.getElementById('chapterTitle').textContent=ch.name;var flat=[];for(var i=0;i<ch.questions.length;i++){var item=ch.questions[i];if(item.subs){for(var j=0;j<item.subs.length;j++){flat.push({type:'配伍选择题',q:item.subs[j].q,opts:item.subs[j].opts,ans:item.subs[j].ans});}}else{flat.push(item);}}ch._flat=flat;currentQuestionIndex=0;answered=0;correct=0;renderOneQuestion();updateNavButtons();}

var item=flat[currentQuestionIndex];var card=document.createElement('div');card.className='card';var tag=document.createElement('div');tag.className='tag';tag.textContent=item.type+'  ·  第 '+(currentQuestionIndex+1)+' / '+flat.length+' 题';card.appendChild(tag);var title=document.createElement('div');title.className='q-title';title.textContent=item.q;card.appendChild(title);var ansArr=item.ans.split('');var isMulti=ansArr.length>1;var selected=[];var allButtons=[];for(var k=0;k<item.opts.length;k++){(function(opt){var btn=document.createElement('button');btn.className='option';btn.textContent=opt;var letter=opt.charAt(0);btn.onclick=function(){if(btn.classList.contains('disabled'))return;if(isMulti){var idx=selected.indexOf(letter);if(idx===-1){selected.push(letter);btn.style.background='#d0e3ff';btn.style.borderColor='#4a90e2';}else{selected.splice(idx,1);btn.style.background='';btn.style.borderColor='';}}else{judgeOne([letter]);}};allButtons.push(btn);card.appendChild(btn);})(item.opts[k]);}
if(isMulti){var submitBtn=document.createElement('button');submitBtn.textContent='提交答案';submitBtn.style.cssText='margin-top:12px;padding:12px 20px;background:#4a90e2;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;width:100%;';submitBtn.onclick=function(){if(selected.length===0){alert('请至少选择一个选项');return;}judgeOne(selected);submitBtn.disabled=true;submitBtn.style.background='#c5d5ea';};card.appendChild(submitBtn);}
var expDiv=document.createElement('div');expDiv.className='explanation';expDiv.textContent=item.exp?'解析：'+item.exp:'';card.appendChild(expDiv);quiz.appendChild(card);
function judgeOne(chosen){var isCorrect=false;if(isMulti){if(chosen.length===ansArr.length){var sc=chosen.slice().sort().join('');var sa=ansArr.slice().sort().join('');isCorrect=(sc===sa);}}else{isCorrect=ansArr.indexOf(chosen[0])!==-1;}
for(var i=0;i<allButtons.length;i++){var b=allButtons[i];var letter=b.textContent.charAt(0);if(ansArr.indexOf(letter)!==-1)b.classList.add('correct');if(!isCorrect&&chosen.indexOf(letter)!==-1&&ansArr.indexOf(letter)===-1)b.classList.add('wrong');b.classList.add('disabled');b.style.background='';b.style.borderColor='';}
if(isCorrect){correct++;answered++;expDiv.classList.add('show');document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';showNextBar(true);var countdown=3;var btn=document.querySelector('.quiz-nav .next-btn:last-child');var timer=setInterval(function(){countdown--;if(btn)btn.textContent='即将跳转… '+countdown;if(countdown<=0){clearInterval(timer);currentQuestionIndex++;renderOneQuestion();}},1000);}else{answered++;document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';expDiv.classList.add('show');showNextBar(false);}}
function showNextBar(mode){var oldBar=document.getElementById('quiz-nav-bar');if(oldBar)oldBar.remove();var bar=document.createElement('div');bar.className='quiz-nav';bar.id='quiz-nav-bar';var flat=chapters[currentChapter]._flat;
if(mode==='chapter-end'){var progress=document.createElement('div');progress.className='progress-text';progress.textContent='本章完成';bar.appendChild(progress);var prevBtn=document.createElement('button');prevBtn.className='next-btn';prevBtn.textContent='上一章';prevBtn.disabled=(currentChapter===0);prevBtn.onclick=function(){prevChapter();};bar.appendChild(prevBtn);var nextBtn=document.createElement('button');nextBtn.className='next-btn';nextBtn.textContent='下一章';nextBtn.disabled=(currentChapter===chapters.length-1);nextBtn.onclick=function(){nextChapter();};bar.appendChild(nextBtn);document.body.appendChild(bar);return;}
var isLast=(currentQuestionIndex>=flat.length-1);if(isLast){var progress=document.createElement('div');progress.className='progress-text';progress.textContent='本章最后一题';bar.appendChild(progress);var prevBtn=document.createElement('button');prevBtn.className='next-btn';prevBtn.textContent='上一题';prevBtn.disabled=(currentQuestionIndex===0);prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};bar.appendChild(prevBtn);var nextChapterBtn=document.createElement('button');nextChapterBtn.className='next-btn';nextChapterBtn.textContent='下一章';nextChapterBtn.disabled=(currentChapter===chapters.length-1);nextChapterBtn.onclick=function(){nextChapter();};bar.appendChild(nextChapterBtn);document.body.appendChild(bar);return;}
var autoNext=(mode===true);var progress=document.createElement('div');progress.className='progress-text';progress.textContent=(currentQuestionIndex+1)+' / '+flat.length;bar.appendChild(progress);var prevBtn=document.createElement('button');prevBtn.className='next-btn';prevBtn.textContent='上一题';prevBtn.disabled=(currentQuestionIndex===0);prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};bar.appendChild(prevBtn);var nextBtn=document.createElement('button');nextBtn.className='next-btn';nextBtn.textContent=autoNext?'即将跳转…':'下一题';nextBtn.disabled=autoNext;nextBtn.onclick=function(){currentQuestionIndex++;renderOneQuestion();};bar.appendChild(nextBtn);document.body.appendChild(bar);}}function buildQuestion(qText,opts,ans,exp){return renderOneQuestionForOld(qText,opts,ans,exp);}
function renderOneQuestionForOld(qText,opts,ans,exp){var wrap=document.createElement('div');var title=document.createElement('div');title.className='q-title';title.textContent=qText;wrap.appendChild(title);var ansArr=ans.split('');var isMulti=ansArr.length>1;var selected=[];for(var i=0;i<opts.length;i++){(function(opt){var btn=document.createElement('button');btn.className='option';btn.textContent=opt;var letter=opt.charAt(0);btn.onclick=function(){if(btn.classList.contains('disabled'))return;if(isMulti){var idx=selected.indexOf(letter);if(idx===-1){selected.push(letter);btn.style.background='#d0e3ff';btn.style.borderColor='#4a90e2';}else{selected.splice(idx,1);btn.style.background='';btn.style.borderColor='';}}else{judge([letter]);}};wrap.appendChild(btn);})(opts[i]);}if(isMulti){var submitBtn=document.createElement('button');submitBtn.textContent='提交答案';submitBtn.style.cssText='margin-top:10px;padding:10px 20px;background:#4a90e2;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;';submitBtn.onclick=function(){if(selected.length===0){alert('请至少选择一个选项');return;}judge(selected);submitBtn.disabled=true;submitBtn.style.background='#c5d5ea';submitBtn.style.cursor='not-allowed';};wrap.appendChild(submitBtn);}function judge(chosen){var allOpts=wrap.querySelectorAll('.option');var isCorrect=false;if(isMulti){if(chosen.length===ansArr.length){var sc=chosen.slice().sort().join('');var sa=ansArr.slice().sort().join('');isCorrect=(sc===sa);}}else{isCorrect=ansArr.indexOf(chosen[0])!==-1;}if(isCorrect){correct++;for(var m=0;m<allOpts.length;m++){if(ansArr.indexOf(allOpts[m].textContent.charAt(0))!==-1){allOpts[m].classList.add('correct');allOpts[m].style.background='';allOpts[m].style.borderColor='';}}}else{for(var n=0;n<allOpts.length;n++){var letter=allOpts[n].textContent.charAt(0);if(chosen.indexOf(letter)!==-1&&ansArr.indexOf(letter)===-1){allOpts[n].classList.add('wrong');}if(ansArr.indexOf(letter)!==-1){allOpts[n].classList.add('correct');}allOpts[n].style.background='';allOpts[n].style.borderColor='';}}for(var p=0;p<allOpts.length;p++)allOpts[p].classList.add('disabled');answered++;document.getElementById('stats').textContent='已答 '+answered+' 题，正确 '+correct+' 题';if(exp){var expDiv=wrap.querySelector('.explanation');if(expDiv)expDiv.classList.add('show');}}if(exp){var expDiv=document.createElement('div');expDiv.className='explanation';expDiv.textContent='解析：'+exp;wrap.appendChild(expDiv);}return wrap;}
initChapterSelect();switchChapter(0);
