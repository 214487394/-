    {type:"多项选择题",q:"患者，女，1岁8个月，因“腹泻2天”就诊。每日排蛋花汤样水便5~8次，量中等，无脓血，伴轻度口干。血常规及粪便常规检查均未见细菌感染证据，考虑为病毒感染性腹泻。针对该患者的病情，可使用的治疗药物包括",opts:["A.地衣芽孢杆菌活菌制剂","B.蒙脱石散","C.左氧氟沙星","D.口服补液盐Ⅲ","E.洛哌丁胺"],ans:"ABD"},
    {type:"多项选择题",q:"患者，女，35岁，长期受腹痛、腹胀困扰，排便费力且粪便干结呈块状，诊断为便秘型肠易激综合征。下列药物中，可用于治疗此类患者的药物包括",opts:["A.利那洛肽","B.洛哌丁胺","C.鲁比前列酮","D.诺氟沙星","E.双八面体蒙脱石散"],ans:"AC"},
    {type:"多项选择题",q:"药师在为消化不良患者提供用药指导时，需根据其具体症状和病因，选择适宜的药物并告知正确的用法。针对不同患者的用药建议，下列说法正确的有",opts:["A.对于白天易出现上腹痛的患者，可早餐后30分钟内服用奥美拉唑肠溶片","B.对于餐后腹胀、食欲不振的患者，可服用干酵母片","C.对于胃动力不足伴有恶心、呕吐的患者，可餐后30分钟服用多潘立酮片","D.对于胆汁分泌不足导致腹胀、腹泻的患者，可服用复方阿嗪米特肠溶片","E.对于夜间基础胃酸分泌增强导致上腹痛的患者，可睡前服用雷尼替丁胶囊"],ans:"BDE"},
    {type:"多项选择题",q:"有关胆石症与胆囊炎的治疗、用药注意事项与患者教育，说法正确的有",opts:["A.对于胆石症合并急性胆囊炎的患者应卧床休息、禁食","B.慢性胆囊炎患者易出现消化不良症状，可应用复方阿嗪米特肠溶片","C.熊去氧胆酸禁用于胆道完全梗阻和严重肝功能减退患者","D.应采取低胆固醇饮食，增加膳食纤维的摄入","E.肥胖者要控制体重，避免快速减重和不吃早餐"],ans:"ABCDE"},

    // ===== 第4节 泌尿生殖系统问题 =====
    {type:"最佳选择题",q:"在妇科门诊，医生常根据患者对阴道分泌物（白带）性状和气味的描述进行初步诊断。下列描述中，最符合细菌性阴道病分泌物临床特征的是",opts:["A.白带呈泡沫状","B.白带呈豆渣样或凝乳状","C.白带呈黄绿色，略带腥味","D.带有鱼腥臭味的稀薄阴道分泌物增多","E.外阴阴道干涩、烧灼刺激"],ans:"D",exp:"细菌性阴道病典型表现为鱼腥臭味稀薄分泌物。"},
    {type:"最佳选择题",q:"患者，女，28岁，诊断为细菌性阴道病，伴有明显的鱼腥臭味和稀薄分泌物增多。医生考虑给予全身药物治疗，应首选的药物是",opts:["A.克林霉素胶囊","B.氟康唑片","C.咪康唑散","D.甲硝唑片","E.克霉唑栓"],ans:"D",exp:"细菌性阴道病全身治疗首选甲硝唑。"},
    {type:"最佳选择题",q:"患者，女，25岁，妊娠期4个月。近2周出现外阴及阴道剧烈瘙痒、灼痛，伴有白色稠厚、豆渣样分泌物，经验性诊断为外阴阴道假丝酵母菌病。该患者经验治疗应首选的药物是",opts:["A.克霉唑栓","B.伊曲康唑片","C.克林霉素片","D.甲硝唑阴道栓","E.甲硝唑片"],ans:"A",exp:"妊娠期外阴阴道假丝酵母菌病首选克霉唑栓局部治疗。"},
    {type:"最佳选择题",q:"某萎缩性阴道炎患者外阴阴道干涩、烧灼刺激以及阴道缺乏黏液所致性生活障碍，应向其推荐的治疗药物是",opts:["A.制霉菌素片","B.甲硝唑泡腾片","C.克霉唑阴道栓","D.氟康唑胶囊","E.普罗雌烯阴道胶丸"],ans:"E",exp:"普罗雌烯阴道胶丸用于萎缩性阴道炎。"},
    {type:"最佳选择题",q:"患者，女，35岁，因外阴瘙痒、黄绿色泡沫状分泌物就诊，阴道分泌物镜检发现阴道毛滴虫，诊断为滴虫性阴道炎。下列关于该病的临床表现和治疗的说法，正确的是",opts:["A.无症状者应避免药物治疗，防止诱发酵母菌感染","B.阴道分泌物的典型表现是白色豆渣样，可呈凝乳状","C.可同时存在多部位滴虫感染，治愈此病需全身给药","D.几乎不会通过性生活传染，性伴侣无需同时治疗","E.治疗药物不会分泌至乳汁中，哺乳期患者用药后无需推迟哺乳时间"],ans:"C",exp:"滴虫性阴道炎需全身给药，性伴侣需同时治疗。"},
    {type:"最佳选择题",q:"在治疗不同类型的阴道炎时，需注意药物特性、用药安全和治疗原则。下列关于阴道炎治疗的说法，错误的是",opts:["A.细菌性阴道病与滴虫性阴道病均可以选择硝基咪唑类药物进行治疗","B.甲硝唑无论是口服还是阴道给药后3日内禁止饮用含乙醇的饮料","C.口服甲硝唑的代谢产物可使尿液呈乳白色","D.滴虫性阴道炎患者在进行治疗时，性伴侣也需要同时进行治疗","E.妊娠期女性应避免使用高剂量氟康唑"],ans:"C",exp:"甲硝唑可使尿液呈深红色或红棕色，不是乳白色。"},
    {type:"最佳选择题",q:"患者，女，35岁，因“外阴瘙痒、灼痛，伴尿频、尿痛3天”就诊。妇科检查见阴道黏膜充血，宫颈散在出血点，呈草莓样外观。阴道分泌物显微镜检找到活动的滴虫，诊断为滴虫性阴道炎。为达到彻底治愈、防止复发的目的，患者应选择的治疗方案是",opts:["A.甲硝唑凝胶5g，阴道给药，每晚1次，共5日","B.甲硝唑片2g，单次顿服","C.克林霉素300mg，口服，每日2次，连用7日","D.甲硝唑阴道栓200mg，每晚1次，共5日","E.氟康唑片150mg，单次顿服"],ans:"B",exp:"滴虫性阴道炎推荐甲硝唑2g单次顿服。"},
    {type:"最佳选择题",q:"患者，女，28岁，产后6周，确诊为哺乳期乳腺炎。药师在提供用药和护理指导时，应避免给出的建议是",opts:["A.乳头皲裂疼痛患者排乳后可用母乳或羊脂膏外涂","B.无法继续母乳喂养患者可给予回乳处理","C.疼痛发热患者可用对乙酰氨基酚或布洛芬对症治疗","D.皮肤破损的患者可用硫酸镁湿敷","E.可采用有效的乳房按摩、热敷冷敷交替等物理疗法"],ans:"D",exp:"皮肤破损者不宜用硫酸镁湿敷。"},
    {type:"最佳选择题",q:"一位哺乳期乳腺炎患者，青霉素皮试阴性，医生经验性选择抗生素时，需考虑药物对婴儿的安全性。下列药物通常不被推荐用于此类患者的初始经验治疗的是",opts:["A.左氧氟沙星","B.头孢拉定","C.头孢克洛","D.头孢美唑","E.苯唑西林"],ans:"A",exp:"左氧氟沙星可影响婴儿软骨发育，哺乳期不推荐。"},
    {type:"最佳选择题",q:"患者，女，30岁，顺产后第4周，右侧乳房出现红、肿、热、痛，伴发热（体温39.2℃），乏力。实验室检查：白细胞计数18×10⁹/L，中性粒细胞百分比88%，降钙素原0.5ng/mL，诊断为哺乳期乳腺炎。关于该患者的治疗，下列建议中错误的是",opts:["A.可口服对乙酰氨基酚解热镇痛治疗","B.应中断母乳喂养","C.可使用高渗盐水局部湿敷","D.可口服头孢拉定抗感染治疗","E.哺乳前可局部热敷，哺乳后可局部冷敷"],ans:"B",exp:"哺乳期乳腺炎一般不中断母乳喂养。"},
    {type:"最佳选择题",q:"患者，女，26岁，因乳头皲裂后出现乳房胀痛、发热，诊断为哺乳期乳腺炎。医生开具抗生素，并告知需足疗程使用以防止复发。如果该患者没有形成脓肿、免疫正常，且药物耐受性好，通常推荐的抗生素疗程是",opts:["A.1-3日","B.3-5日","C.5-7日","D.7-10日","E.10-14日"],ans:"E",exp:"哺乳期乳腺炎抗生素疗程通常为10-14日。"},
    {type:"最佳选择题",q:"患者，女，33岁，哺乳期乳腺炎，发热39.5℃，乳房红肿明显，血培养结果为耐甲氧西林金黄色葡萄球菌。患者需住院静脉抗感染治疗，下列药物可选用的是",opts:["A.红霉素","B.头孢曲松","C.阿奇霉素","D.万古霉素","E.克林霉素"],ans:"D",exp:"MRSA感染首选万古霉素。"},
    {type:"最佳选择题",q:"患者，女，30岁，产后3天，新生儿因严重先天性心脏病转入新生儿重症监护室并需长期肠外营养，无法进行母乳喂养。为减轻产妇乳房胀痛并预防乳腺炎，医生计划给予药物回乳。宜选用的药物是",opts:["A.乙烯雌酚片","B.阿莫西林胶囊","C.炉甘石洗剂","D.25%硫酸镁溶液","E.溴隐亭片"],ans:"E",exp:"溴隐亭可用于回乳。"},
    {type:"最佳选择题",q:"患者，女，35岁，非哺乳期。右侧乳晕周围出现红、肿、痛性肿块，伴乳头溢液，超声提示导管扩张伴周围炎症，诊断为导管周围乳腺炎急性发作。关于该患者的治疗，下列说法错误的是",opts:["A.治疗以外科手术为主","B.抗生素治疗是急性期重要辅助手段","C.病变急性期应避免使用抗生素","D.病变急性期经验性使用阿莫西林-克拉维酸控制炎症","E.怀疑厌氧菌感染时需加用口服甲硝唑"],ans:"C",exp:"导管周围乳腺炎急性期应使用抗生素。"},
    {type:"最佳选择题",q:"关于肉芽肿性小叶乳腺炎的药物治疗原则，下列说法正确的是",opts:["A.应长期使用广谱抗生素预防感染","B.以类固醇激素控制炎症为主","C.常规使用抗结核药物治疗","D.以口服甲硝唑抑制厌氧菌为主","E.推荐使用雌激素制剂调节内分泌"],ans:"B",exp:"肉芽肿性小叶乳腺炎以类固醇激素控制炎症为主。"},
    {type:"最佳选择题",q:"患者，女，35岁，产后5周，因右侧乳房胀痛、发热诊断为哺乳期乳腺炎。下列针对她的护理指导中，正确的是",opts:["A.推荐卡麦角林用于哺乳期乳腺炎回乳","B.所有哺乳期乳腺炎患者都必须停止哺乳","C.局部明显红肿时可进行热敷","D.哺乳前热敷并按摩乳房，有助于刺激泌乳","E.对于MRSA感染的哺乳期乳腺炎患者，可正常对早产儿哺乳"],ans:"D",exp:"哺乳前热敷并按摩有助于排乳。"},
    {type:"最佳选择题",q:"患者，女，28岁，因尿频、尿急、尿痛就诊，尿常规示白细胞（+++），临床诊断为急性膀胱炎。该病最常见的致病菌是",opts:["A.腐生葡萄球菌","B.大肠埃希菌","C.肺炎克雷伯杆菌","D.肠球菌","E.铜绿假单胞菌"],ans:"B",exp:"急性膀胱炎最常见致病菌为大肠埃希菌。"},
    {type:"最佳选择题",q:"患者，女，28岁，妊娠14周，诊断为急性单纯性膀胱炎。该患者宜选用的抗菌药物是",opts:["A.环丙沙星","B.甲氧苄啶","C.呋喃妥因","D.甲硝唑","E.阿奇霉素"],ans:"C",exp:"妊娠期急性膀胱炎首选呋喃妥因。"},
    {type:"最佳选择题",q:"患者，女，36岁，近期出现尿频、尿急、尿痛等症状，前往医院就诊。医生安排进行尿培养检查，结果提示为大肠埃希菌（ESBL阳性）感染的急性细菌性膀胱炎。在为该患者制定治疗方案时，以下首选的治疗药物是",opts:["A.头孢氨苄","B.苯唑西林","C.氯唑西林","D.氨苄西林-舒巴坦","E.磺胺甲噁唑-甲氧苄啶"],ans:"D",exp:"ESBL阳性大肠埃希菌感染首选氨苄西林-舒巴坦。"},
    {type:"最佳选择题",q:"患者，女，50岁，因尿频、尿急、尿痛等典型膀胱刺激征前来就诊。尿液检查及细菌培养结果显示，该患者所患急性细菌性膀胱炎的致病菌为肠球菌属。医生在为其制定治疗方案、选择治疗药物时，下列不宜选择的是",opts:["A.磷霉素氨丁三醇","B.氨苄西林","C.万古霉素","D.阿莫西林","E.四环素类"],ans:"E",exp:"肠球菌对四环素类耐药，不宜选用。"},
    {type:"最佳选择题",q:"关于急性细菌性膀胱炎的治疗疗程及疗效判断，说法正确的是",opts:["A.一种药物需连用14天","B.通常一种药物连用3天，约90%患者可治愈","C.治疗全程需联合使用两种抗菌药物","D.若仍有菌尿，应继续给予3天抗菌药物治疗","E.停服抗菌药物3天后，进行尿细菌定量培养判断疗效"],ans:"B",exp:"急性膀胱炎通常3天短程治疗，约90%可治愈。"},
    {type:"最佳选择题",q:"患者，男，34岁，因发热、腰痛、尿频、尿急等症状就医，诊断为肾盂肾炎。在尚未明确病原菌的情况下，医生准备进行经验性用药。以下药物中，不适合作为此次经验性治疗的是",opts:["A.阿莫西林","B.头孢他啶","C.环丙沙星","D.万古霉素","E.氨苄西林"],ans:"D",exp:"万古霉素不用于肾盂肾炎经验治疗。"},
    {type:"最佳选择题",q:"对于腐生葡萄球菌（MRS）引起的肾盂肾炎，应选择的治疗药物是",opts:["A.苯唑西林","B.糖肽类","C.氟喹诺酮类","D.第一代头孢菌素","E.阿莫西林-克拉维酸"],ans:"B",exp:"MRS感染首选糖肽类。"},
    {type:"最佳选择题",q:"与急性膀胱炎的治疗疗程不同，无并发症的急性肾盂肾炎口服抗生素治疗应持续",opts:["A.3~5日","B.5~7日","C.7~14日","D.14~21日","E.14~28日"],ans:"C",exp:"无并发症急性肾盂肾炎口服抗生素疗程7~14日。"},
    {type:"最佳选择题",q:"患者，男，63岁，因高热、寒战、腰痛以及尿频、尿急、尿痛等症状入院。尿液细菌培养结果显示为铜绿假单胞菌引起的肾盂肾炎。下列用药方案最合适的是",opts:["A.阿莫西林+氨基糖苷类","B.苯唑西林+环丙沙星","C.氟康唑+亚胺培南","D.阿奇霉素+哌拉西林-他唑巴坦","E.头孢他啶+氨基糖苷类"],ans:"E",exp:"铜绿假单胞菌肾盂肾炎首选头孢他啶+氨基糖苷类。"},
    {type:"最佳选择题",q:"患者，女，40岁，因长期使用免疫抑制剂，近期出现乏力、发热，伴有尿频、尿急、尿痛等泌尿系统症状。诊断为急性肾盂肾炎，尿培养结果念珠菌感染。针对该患者的病情，应优先选择的药物是",opts:["A.左氧氟沙星","B.氟康唑","C.头孢曲松","D.阿莫西林-克拉维酸","E.呋喃妥因"],ans:"B",exp:"念珠菌肾盂肾炎首选氟康唑。"},
    {type:"最佳选择题",q:"患者，女，26岁，孕22周，出现尿路刺激症状，诊断为急性膀胱炎。下列药物中不能选用的是",opts:["A.多西环素","B.阿莫西林","C.头孢噻肟","D.磷霉素","E.呋喃妥因"],ans:"A",exp:"多西环素妊娠期禁用。"},

},{
  name: "第十章 神经精神系统常见疾病",
  questions: [
    // ===== 第1节 焦虑抑郁 =====
    {type:"最佳选择题",q:"1. 患者，女，28岁，因遭遇重大生活事件后出现“心悸、紧张、无法放松1周”就诊。临床诊断：急性焦虑发作。为快速控制症状，医师开具劳拉西泮片0.5mg tid。该药物的使用时长不宜超过",opts:["A.2~3天","B.2~3周","C.2~3个月","D.3~6个月","E.6~12个月"],ans:"B",exp:"劳拉西泮用于急性焦虑发作，使用时间不宜超过2~3周。"},
    {type:"最佳选择题",q:"2. 患者，男，40岁，被诊断为广泛性焦虑症。因工作性质（操作精密仪器），患者对药物的镇静作用和认知影响非常担忧，同时表示自己家人有药物滥用史，非常关注药物的依赖性。下列哪种抗焦虑药物最符合该患者的需求，但需告知其起效较慢，需2~4周",opts:["A.地西泮","B.丁螺环酮","C.阿普唑仑","D.氯米帕明","E.阿米替林"],ans:"B",exp:"丁螺环酮无依赖性，起效较慢，需2~4周。"},
    {type:"最佳选择题",q:"3. 患者，男，50岁，长期受抑郁症困扰，情绪低落、兴趣缺失、精力不济，日常活动严重受限。近期因心悸、胸闷等不适就诊，经全面检查，确诊患有严重心脏病，心脏功能显著受损，心功能分级为Ⅲ级。在制定该抑郁症患者治疗方案时，考虑到其心脏状况，不宜使用的药物是",opts:["A.舍曲林","B.丙米嗪","C.氟伏沙明","D.西酞普兰","E.氟西汀"],ans:"B",exp:"丙米嗪为三环类抗抑郁药，心脏毒性大，心功能不全者不宜使用。"},
    {type:"最佳选择题",q:"4. 患者，女，53岁，近半年来常感莫名紧张、坐立不安，经精神科评估诊断为焦虑症。同时，患者多年前被确诊患有原发性闭角型青光眼，一直遵医嘱用药控制眼压。在为该患者制定抗焦虑治疗方案时，考虑到其青光眼病情，禁用的抗焦虑药物是",opts:["A.舍曲林","B.阿米替林","C.氟西汀","D.吗氯贝胺","E.坦度螺酮"],ans:"B",exp:"阿米替林有抗胆碱作用，可诱发闭角型青光眼急性发作。"},
    {type:"最佳选择题",q:"5. 患者，女，60岁，冠心病史2年，目前服用硝酸异山梨酯、阿托伐他汀钙。近三个月因胃痛、心境低落、有自杀倾向就诊，临床诊断为消化性溃疡、抑郁症。医师给予奥美拉唑肠溶片40mg qd po，度洛西汀肠溶胶囊60mg qd po，谷维素片10mg tid po治疗，患者用药后出现血压升高。可能导致该患者血压升高的药物是",opts:["A.谷维素片","B.硝酸异山梨酯片","C.阿托伐他汀钙片","D.奥美拉唑肠溶片","E.度洛西汀肠溶胶囊"],ans:"E",exp:"度洛西汀可致血压升高。"},
    {type:"最佳选择题",q:"6. 患者，男，48岁，患有广泛性焦虑症并伴有2型糖尿病，在选药时需特别注意药物对体重的影响。在各类抗焦虑药物中，极易导致患者食欲亢进，进而引发体重增加的药物是",opts:["A.丙米嗪","B.呋塞米","C.米氮平","D.氟西汀","E.丁螺环酮"],ans:"C",exp:"米氮平可致食欲亢进和体重增加。"},
    {type:"最佳选择题",q:"7. 患者，女，35岁，因焦虑症就诊，开始接受抗焦虑药物治疗。近日，患者在户外活动后，面部、颈部等暴露部位出现严重红斑、瘙痒，伴有灼痛感，诊断为光过敏反应。追溯用药史，该患者近期未曾使用其他特殊药物。在其服用的抗焦虑药物中，最有可能导致此次光过敏毒性反应的是",opts:["A.坦度螺酮","B.阿普唑仑","C.阿米替林","D.氯米帕明","E.圣约翰草提取物"],ans:"D",exp:"氯米帕明可致光过敏反应。"},
    {type:"最佳选择题",q:"8. 患者，男，40岁，诊断为抑郁症，用药后自觉心前区不适，心电图显示其QT间期延长。患者近期未用其他特殊药物，考虑此现象与抗抑郁药有关。下列可导致QT间期延长的抗抑郁药是",opts:["A.阿戈美拉汀","B.艾司唑仑","C.普萘洛尔","D.司来吉兰","E.氟哌噻吨美利曲辛"],ans:"E",exp:"氟哌噻吨美利曲辛可致QT间期延长。"},
    {type:"最佳选择题",q:"9. 患者，男，55岁，临床诊断为抑郁症，拟给予氟西汀20mg qd起始治疗。患者治疗期间应避免联合使用，否则可能会引起5-HT综合征的药物是",opts:["A.丁螺环酮","B.米氮平","C.阿普唑仑","D.利奈唑胺","E.曲唑酮"],ans:"D",exp:"利奈唑胺为单胺氧化酶抑制剂，与氟西汀合用可致5-HT综合征。"},
    {type:"最佳选择题",q:"10. 在选择性5-羟色胺再摄取抑制剂（SSRIs）中，下列药物停药后出现戒断反应风险最高的是",opts:["A.氟西汀","B.舍曲林","C.西酞普兰","D.帕罗西汀","E.地西泮"],ans:"D",exp:"帕罗西汀停药后戒断反应风险最高。"},
    {type:"最佳选择题",q:"11. 患者，男，48岁，因家庭变故出现急性焦虑，医师给予阿普唑仑进行治疗。下列关于该患者的用药指导，说法不正确的是",opts:["A.不宜过量使用，避免与酒精或其他能引起嗜睡的药物合用","B.用药期间不宜从事驾驶、仪器操作或其他需要集中精神才能完成的工作","C.停药易引起症状复发或戒断症状","D.小剂量起始，滴定增量，长期规律用药","E.老年人由于躯体功能受损，容易跌倒，避免长期使用"],ans:"D",exp:"阿普唑仑不宜长期规律用药，应短期使用。"},
    {type:"最佳选择题",q:"12. 下列关于抗抑郁药的用药注意事项与患者教育，说法错误的是",opts:["A.剂量应逐步递增，尽可能用最小有效剂量以减少不良反应，提高服药依从性","B.小剂量用药3日疗效不佳时，直接换用同类其他药物或作用机制不同的另一类药物","C.换药或停药时应逐渐减量，避免出现戒断症状","D.对抑郁症应实施全程治疗，急性期治疗至少3个月","E.复发病例在巩固期后视复发次数和频度还应进行1～5年的维持期治疗"],ans:"B",exp:"抗抑郁药起效需2~4周，不应3日无效即换药。"},
    {type:"配伍选择题",subs:[
      {q:"13. 一名对选择性5-羟色胺再摄取抑制剂疗效不佳的抑郁症患者，医生考虑换用一种作用机制不同的抗抑郁药。该药物是一种可逆性、选择性单胺氧化酶A抑制剂。该药物是",opts:["A.多塞平","B.米氮平","C.吗氯贝胺","D.丁螺环酮","E.西酞普兰"],ans:"C"},
      {q:"14. 急诊科收治一名疑似药物过量中毒的抑郁症患者，患者表现为意识昏迷、全身肌肉痉挛发作、心律失常，同时伴有瞳孔散大、皮肤潮红干燥、肠鸣音消失等显著的外周抗胆碱能症状。最可能导致其中毒的药物是",opts:["A.多塞平","B.米氮平","C.吗氯贝胺","D.丁螺环酮","E.西酞普兰"],ans:"A"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"15. 患者，男，72岁，新近诊断为伴有显著焦虑的抑郁症。考虑到其年龄因素，医生希望选用一种疗效确切、安全性相对较好的一线抗抑郁药，该药同时能有效缓解其焦虑症状。应优先选择的药物是",opts:["A.吗氯贝胺","B.阿戈美拉汀","C.普萘洛尔","D.帕罗西汀","E.扎来普隆"],ans:"D"},
      {q:"16. 患者，女，38岁，诊断为广泛性焦虑症，其突出症状为在各种场合下出现心慌、手抖、出汗等明显的躯体性焦虑表现。医生计划选用一种能针对性缓解这些躯体症状，但单用作用有限。应优先选择的药物是",opts:["A.吗氯贝胺","B.阿戈美拉汀","C.普萘洛尔","D.帕罗西汀","E.扎来普隆"],ans:"C"},
      {q:"17. 患者，男，45岁，诊断为抑郁症，并伴有严重的入睡困难和昼夜节律紊乱。医生希望选用一种既能抗抑郁，又能改善睡眠的药物。应优先选择的药物是",opts:["A.吗氯贝胺","B.阿戈美拉汀","C.普萘洛尔","D.帕罗西汀","E.扎来普隆"],ans:"B"}
    ]},

    // ===== 第2节 失眠症 =====
    {type:"最佳选择题",q:"1. 患者，男，75岁，主诉慢性失眠。在考虑药物治疗时，医师希望选择一种对老年人群相对安全、一般不导致日间困倦，目前被推荐作为治疗失眠一线药物的是",opts:["A.苯二氮䓬类药物","B.非苯二氮䓬类药物","C.胆碱酯酶抑制剂","D.选择性5-羟色胺再摄取抑制剂","E.5-羟色胺受体拮抗剂"],ans:"B",exp:"非苯二氮䓬类药物为失眠一线治疗药物。"},
    {type:"最佳选择题",q:"2. 患者，女，62岁，近一个月来深受睡眠问题困扰，每晚入睡时间大约4小时，夜间易醒，醒后难以再次入睡。白天频繁感到头昏脑胀、精神疲倦，严重影响日常的生活与活动。在此期间，患者尝试调整作息、改善睡眠环境等非药物治疗方法，但均未取得明显效果。基于此，推荐的药物治疗方案是",opts:["A.劳拉西泮","B.苯巴比妥","C.唑吡坦","D.吗氯贝胺","E.艾司唑仑"],ans:"C",exp:"唑吡坦为非苯二氮䓬类催眠药，适用于入睡困难。"},
    {type:"最佳选择题",q:"3. 患者，女，60岁，因“入睡困难、睡眠浅、次日感疲倦和注意力不集中”持续半年就诊。她曾短期使用过艾司唑仑，虽有效但担心长期服用会上瘾和影响记忆力，故自行停药。鉴于患者有药物依赖顾虑且需要长期治疗，药师根据其情况，推荐了一种没有药物依赖性、也不会产生戒断症状、已获准长期使用治疗失眠的褪黑素受体激动剂为",opts:["A.氯硝西泮","B.佐匹克隆","C.多塞平","D.帕罗西汀","E.雷美尔通"],ans:"E",exp:"雷美尔通为褪黑素受体激动剂，无依赖性。"},
    {type:"最佳选择题",q:"4. 患者，男，60岁，因焦虑伴失眠短期使用阿普唑仑。需特别提醒该患者注意的药物风险是",opts:["A.粒细胞缺乏","B.心悸、震颤","C.5-羟色胺综合征"],ans:"B",exp:"阿普唑仑突然停药可致心悸、震颤等戒断反应。"},
    {type:"最佳选择题",q:"5. 有关抗失眠药物合理应用的说法，错误的是",opts:["A.睡眠障碍继发于或伴发于其他疾病时，只需治疗睡眠障碍，原发疾病可自行缓解","B.原发性失眠首选短效的非苯二氮䓬类药物","C.长期应用镇静催眠药物的慢性失眠患者，提倡间歇治疗或按需治疗","D.老年失眠患者药物治疗推荐使用non-BZDs或褪黑素受体激动剂","E.焦虑症患者存在失眠时，以抗焦虑药物为主，必要时睡前加用镇静催眠药物"],ans:"A",exp:"睡眠障碍继发于其他疾病时，应同时治疗原发疾病。"},

    // ===== 第3节 脑卒中 =====
    {type:"最佳选择题",q:"1. 非心源性缺血性脑卒中患者，无房颤。为预防卒中复发，应长期服用的药物是",opts:["A.阿哌沙班","B.达比加群酯","C.氯吡格雷","D.低分子肝素","E.华法林"],ans:"C",exp:"非心源性缺血性脑卒中抗血小板治疗，可长期服用氯吡格雷。"},
    {type:"最佳选择题",q:"2. 下列维生素组合中，用于降低血同型半胱氨酸水平的是",opts:["A.叶酸、维生素B₁、维生素B₂","B.烟酸、维生素B₁、维生素B₆","C.叶酸、维生素B₆、维生素B₁₂","D.烟酸、维生素B₆、维生素B₁₂","E.叶酸、维生素B₂、维生素B₆"],ans:"C",exp:"叶酸、维生素B₆、维生素B₁₂可降低同型半胱氨酸。"},
    {type:"最佳选择题",q:"3. 患者，女，50岁，因机械二尖瓣置换术后合并房颤，近期短暂性脑缺血发作。应选择的抗凝药物是",opts:["A.甘油果糖","B.双嘧达莫","C.西洛他唑","D.胞二磷胆碱","E.华法林"],ans:"E",exp:"机械瓣膜合并房颤需华法林抗凝。"},
    {type:"最佳选择题",q:"4. 对发病在24小时内，非心源性、卒中高复发风险（ABCD₂评分≥4分）的TIA患者，须尽早给予的用药方案是",opts:["A.氯吡格雷治疗30日","B.阿司匹林治疗21日","C.替格瑞洛治疗60日","D.阿司匹林+氯吡格雷治疗21日","E.阿司匹林+华法林治疗30日"],ans:"D",exp:"高复发风险TIA推荐阿司匹林+氯吡格雷双抗21日。"},
    {type:"最佳选择题",q:"5. 对发病30日内伴有症状性颅内动脉严重狭窄（狭窄率70%~99%）的TIA患者，须尽早给予的用药方案是",opts:["A.阿司匹林单药治疗90日","B.氯吡格雷单药治疗90日","C.西洛他唑联合替格瑞洛个体化治疗","D.西洛他唑联合双嘧达莫个体化治疗","E.阿司匹林联合氯吡格雷治疗90日，之后单药长期二级预防"],ans:"E",exp:"症状性颅内动脉严重狭窄TIA推荐双抗90日后单药长期二级预防。"},
    {type:"最佳选择题",q:"6. 对于合并非瓣膜性心房颤动的缺血性卒中或TIA患者，下列关于预防卒中复发的治疗方案，说法错误的是",opts:["A.推荐口服抗凝药物以减少卒中复发","B.使用华法林的目标剂量是维持INR在2.0~3.0","C.直接口服抗凝药包含利伐沙班、阿哌沙班以及艾多沙班，不包含达比加群酯","D.若患者不能接受抗凝治疗，推荐应用阿司匹林单药治疗","E.推荐使用华法林或直接口服抗凝药抗凝治疗，预防再发的血栓栓塞事件"],ans:"C",exp:"直接口服抗凝药包括达比加群酯。"},
    {type:"最佳选择题",q:"7. 患者，男，60岁，高血压病史9年，4h前出现头晕，眼前发黑，口齿不利，说话含糊，右手抬不起等症状，紧急送医，诊断为缺血性脑卒中急性期。查体：血压210/114mmHg，心率86次/分。针对该患者的降压治疗，最合适的药物是",opts:["A.阿替普酶","B.氨氯地平","C.拉贝洛尔","D.缬沙坦","E.氯吡格雷"],ans:"C",exp:"急性缺血性脑卒中降压首选拉贝洛尔。"},
    {type:"最佳选择题",q:"8. 缺血性脑卒中合并糖尿病患者，应加强血糖监测并及时进行相应处理。当血糖超过10mmol/L时可给予的药物是",opts:["A.叶酸","B.葡萄糖溶液","C.胰岛素","D.依达拉奉","E.甘露醇"],ans:"C",exp:"血糖超过10mmol/L可给予胰岛素。"},
    {type:"最佳选择题",q:"9. 对缺血性脑卒中发病4.5小时内且无用药禁忌证的患者，首选的治疗方案是",opts:["A.静脉滴注呋塞米","B.口服阿司匹林肠溶片","C.静脉注射替奈普酶","D.皮下注射低分子肝素","E.静脉滴注尼卡地平"],ans:"C",exp:"发病4.5小时内首选静脉溶栓，替奈普酶可选。"},
    {type:"最佳选择题",q:"10. 患者，男，58岁，高血压病史5年，吸烟史40年，2小时前出现左侧肢体无力，并逐渐加重，不能站立。家属发现其说话迟钝含混，右侧鼻唇沟变浅，意识清楚，送至某医院急诊。BP170/95mmHg，血常规基本正常，进行头部磁共振成像（MRI）检查后，诊断为急性脑梗死。该患者首选的治疗方案是",opts:["A.华法林片3mg qd po","B.氯吡格雷片75mg qd po","C.阿司匹林300mg st po","D.阿司匹林肠溶片100mg qd po","E.注射用阿替普酶0.9mg/kg iv.gtt"],ans:"E",exp:"急性脑梗死2小时，首选阿替普酶静脉溶栓。"},
    {type:"最佳选择题",q:"11. 患者，女，72岁，有高纤维蛋白原血症，3天前行膝关节置换术，今晨突发左侧肢体无力、言语不清，发病9小时就诊，诊断为急性缺血性脑卒中。宜选用的急性期治疗药物是",opts:["A.阿替普酶","B.巴曲酶","C.尿激酶","D.胰酶","E.丁基苯肽"],ans:"B",exp:"高纤维蛋白原血症，超过溶栓时间窗，可选巴曲酶降纤。"},
    {type:"最佳选择题",q:"12. 患者，男，70岁，因突发左侧肢体无力、言语不清2小时急诊入院。头颅CT检查排除脑出血，诊断为急性脑梗死。入院后，医疗团队迅速制定治疗方案以改善其预后。该患者可选用的神经保护剂是",opts:["A.替奈普酶","B.替格瑞洛","C.胞二磷胆碱","D.低分子肝素","E.阿司匹林"],ans:"C",exp:"胞二磷胆碱为神经保护剂。"},
    {type:"最佳选择题",q:"13. 患者，男，63岁，CYP2C19功能缺失等位基因携带者，因缺血性脑卒中服用药物预防血栓复发，患者不应选用的治疗药物是",opts:["A.阿司匹林","B.替格瑞洛","C.氯吡格雷","D.西洛他唑","E.双嘧达莫"],ans:"C",exp:"CYP2C19功能缺失者氯吡格雷疗效差。"},
    {type:"最佳选择题",q:"14. 为减少甘露醇长期使用引起的电解质紊乱和反跳现象，在脑梗死脱水治疗中可与之交替使用的药物是",opts:["A.甘油果糖","B.呋塞米","C.人血白蛋白","D.地塞米松","E.螺内酯"],ans:"A",exp:"甘油果糖可与甘露醇交替使用。"},
    {type:"最佳选择题",q:"15. 患者，女，61岁，于凌晨2点起夜时在家中突然出现右侧肢体无力、言语不清症状。早晨家属紧急将其送往附近医院，到达医院时间为6点45分。经头颅CT等检查，确诊为缺血性脑卒中。此时距离发病已过4小时45分。关于该患者的治疗，下列说法最适宜的是",opts:["A.由于已错过最佳溶栓时间，不能进行溶栓治疗","B.立即给予口服阿司匹林100mg/d治疗","C.应给予尿激酶100万～150万IU，溶于生理盐水100～200ml，持续静脉滴注30分钟","D.应给予降纤酶50万IU，溶于生理盐水50ml，快速静脉推注","E.应先观察24小时，再决定是否进行溶栓"],ans:"C",exp:"尿激酶可用于发病6小时内溶栓。"},
    {type:"最佳选择题",q:"16. 下列关于脑卒中治疗与预防的说法中，错误的是",opts:["A.急性期脑梗死应在时间窗内迅速明确诊断，没有禁忌证者应予溶栓治疗","B.TIA可能是脑梗死发生的先兆，需及时就诊","C.发病后3小时内溶栓有助于避免脑卒中后遗症","D.一级预防是指发生卒中后预防复发","E.高风险人群应提前了解30分钟车程内可开展溶栓治疗的“24小时/7天”医疗机构"],ans:"D",exp:"一级预防是未发生卒中前的预防，二级预防才是卒中后预防复发。"},
    {type:"最佳选择题",q:"17. 下列有关脑出血和蛛网膜下腔出血患者一般治疗的说法，错误的是",opts:["A.过度烦躁不安的患者可适量应用镇静药","B.有意识障碍、缺氧征象的患者需给予吸氧","C.昏迷或有吞咽困难患者应给予鼻饲流食","D.需定期翻身、肢体被动活动、使用气垫床等措施预防压疮","E.所有患者均需严格卧床6周以上，禁止早期活动"],ans:"E",exp:"并非所有患者均需严格卧床6周以上。"},
    {type:"最佳选择题",q:"18. 患者，56岁，因突发头痛、呕吐伴左侧肢体无力急诊入院，头颅CT确诊为脑出血。入院后患者颅内压持续升高，出现意识障碍加重等表现。此时，首选用于降低该患者颅内压的药物是",opts:["A.阿替普酶","B.华法林","C.普通肝素","D.甘露醇","E.氢氯噻嗪"],ans:"D",exp:"脑出血颅内压升高首选甘露醇。"},
    {type:"最佳选择题",q:"19. 患者，女，70岁，既往有高血压病史，突发头痛、右侧肢体偏瘫，血压185/105mmHg，CT示脑出血（非凝血功能障碍所致）。下列处理措施中，不正确的是",opts:["A.保持呼吸道通畅","B.静脉滴注止血药物","C.使用降压药控制血压","D.维持水电解质平衡","E.降低颅内压，减轻脑水肿"],ans:"B",exp:"非凝血功能障碍所致脑出血不推荐常规止血药物。"},
    {type:"最佳选择题",q:"20. 下列抗凝药与拮抗剂的配对中，正确的是",opts:["A.华法林—鱼精蛋白","B.达比加群酯—维生素K","C.利伐沙班—依达赛珠单抗","D.普通肝素—鱼精蛋白","E.艾多沙班—鱼精蛋白"],ans:"D",exp:"普通肝素拮抗剂为鱼精蛋白。"},
    {type:"最佳选择题",q:"21. 有关脑出血患者急性期治疗的说法，正确的是",opts:["A.大多数患者均以手术治疗为主","B.若无禁忌证均应积极开展止血药物治疗","C.华法林导致的脑出血应给予硫酸鱼精蛋白拮抗治疗","D.保持气道畅通，有意识障碍者应给予吸氧","E.肝素过量导致的脑出血应给予维生素K拮抗治疗"],ans:"D",exp:"脑出血急性期应保持气道畅通，有意识障碍者吸氧。"},
    {type:"最佳选择题",q:"22. 下列有关急性缺血性脑卒中药物治疗的说法，正确的是",opts:["A.溶栓后立即给予阿司匹林以预防再梗死","B.抗血小板聚集是目前最主要恢复脑血流的措施","C.甘露醇静脉滴注可降低颅内压","D.甘油果糖的脱水作用比甘露醇更强、更快","E.应在使用溶栓药的同时联合使用华法林"],ans:"C",exp:"甘露醇可降低颅内压。"},
    {type:"配伍选择题",subs:[
      {q:"23. 患者，女，72岁，诊断为缺血性脑卒中，现已错过静脉溶栓时机。入院后查血显示纤维蛋白原水平显著升高。在对患者进行全面评估并排除禁忌证后，为降低其高纤维蛋白原水平，可考虑选用的具有降纤作用的药物是",opts:["A.阿替普酶","B.新蛇酶","C.替格瑞洛","D.叶酸、维生素B₆、维生素B₁₂","E.辅酶Q、谷胱甘肽、右雷佐生"],ans:"B"},
      {q:"24. 患者，男，68岁，诊断为短暂性脑缺血发作（TIA）。实验室检查显示：空腹血清同型半胱氨酸水平显著升高。除了常规抗血小板治疗外，针对其高同型半胱氨酸血症这一危险因素，应建议补充的药物是",opts:["A.阿替普酶","B.新蛇酶","C.替格瑞洛","D.叶酸、维生素B₆、维生素B₁₂","E.辅酶Q、谷胱甘肽、右雷佐生"],ans:"D"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"25. 某TIA患者，未发现心房颤动、瓣膜病等心源性栓塞证据，考虑为动脉粥样硬化性（非心源性）TIA。对于此类患者，为预防卒中复发，建议给予的药物是",opts:["A.依达拉奉","B.尿激酶","C.丁基苯酞","D.阿司匹林","E.华法林"],ans:"D"},
      {q:"26. 对合并瓣膜性心房颤动（即存在中至重度二尖瓣狭窄或机械心脏瓣膜病合并心房颤动）的TIA患者，为预防卒中复发，建议给予的药物是",opts:["A.依达拉奉","B.尿激酶","C.丁基苯酞","D.阿司匹林","E.华法林"],ans:"E"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"27. 患者，女，53岁，有高血压病史，未规律用药。晨起与人争执后突发剧烈头痛，随即倒地、意识不清，诊断为高血压性脑出血。针对该患者当前颅内压增高的症状，应立即静脉给予快速降低颅内压的急救药物是",opts:["A.替奈普酶","B.阿替普酶","C.阿司匹林","D.氯吡格雷","E.甘露醇"],ans:"E"},
      {q:"28. 患者，女，66岁，既往有支气管哮喘病史，2个月前因车祸致“重型颅脑损伤”入院治疗。3h前出现头晕、呼吸不畅、口齿不清、说话含糊，自述左手无法抬起，诊断为缺血性脑卒中。针对该患者的情况，最适宜的药物是",opts:["A.替奈普酶","B.阿替普酶","C.阿司匹林","D.氯吡格雷","E.甘露醇"],ans:"B"}
    ]},
    {type:"多项选择题",q:"29. 给一缺血性脑卒中患者给予标准静脉溶栓治疗后，为后续进一步改善脑循环、保护神经细胞、促进神经功能恢复，可考虑联合的药物有",opts:["A.丁基苯酞","B.甘油果糖","C.巴曲酶","D.依达拉奉","E.胞二磷胆碱"],ans:"ACDE",exp:"甘油果糖为脱水药，不用于神经保护。"},
    {type:"多项选择题",q:"30. 急诊室接诊一名64岁女性患者，初步诊断为急性缺血性脑卒中，拟评估是否可行静脉溶栓治疗。作为医生或参与决策的临床药师，需迅速回顾并识别其是否存在溶栓禁忌证。下列属于静脉溶栓禁忌证的有",opts:["A.近2周内进行过大型外科手术","B.血小板计数<100×10⁹/L","C.近3个月内有严重头颅外伤史或卒中史","D.血小板计数>300×10⁹/L","E.收缩压≥180mmHg或舒张压≥100mmHg"],ans:"ABCE",exp:"血小板计数>300×10⁹/L不是溶栓禁忌。"},

    // ===== 第4节 帕金森病 =====
    {type:"最佳选择题",q:"1. 关于帕金森病的药物治疗原则，下列说法错误的是",opts:["A.药物治疗是帕金森病首选且贯穿整个治疗过程的主要手段","B.手术治疗可作为药物治疗的有效补充","C.药物治疗时应避免“剂量滴定”，以免产生急性不良反应","D.抗帕金森病药物治疗，尤其是使用左旋多巴时不能突然停药","E.药物治疗原则是尽可能以小剂量达到满意临床效果，降低运动并发症发生率"],ans:"C",exp:"帕金森病药物治疗应进行剂量滴定。"},
    {type:"最佳选择题",q:"2. 患者，男，75岁，帕金森病，有前列腺增生病史。下列药物中应避免使用的是",opts:["A.左旋多巴","B.苯海索","C.普拉克索","D.司来吉兰","E.恩他卡朋"],ans:"B",exp:"苯海索为抗胆碱药，前列腺增生者禁用。"},
    {type:"最佳选择题",q:"3. 对于晚发型或伴有智能减退的帕金森病患者，一般首选的治疗药物是",opts:["A.苯海索","B.金刚烷胺","C.司来吉兰","D.恩他卡朋","E.多巴丝肼"],ans:"E",exp:"晚发型或伴智能减退首选复方左旋多巴（多巴丝肼）。"},
    {type:"最佳选择题",q:"4. 主要适用于伴有震颤的帕金森病患者，而对无震颤的患者不推荐应用。长期用药需定期复查认知功能的药物是",opts:["A.复方左旋多巴","B.苯海索","C.金刚烷胺","D.溴隐亭","E.雷沙吉兰"],ans:"B",exp:"苯海索适用于伴震颤者，需定期复查认知功能。"},
    {type:"最佳选择题",q:"5. 关于复方左旋多巴治疗帕金森病的用药指导，下列说法错误的是",opts:["A.活动性消化性溃疡者慎用","B.精神病患者禁用","C.为减少胃肠道刺激，应与高蛋白餐同服","D.长期用药后不可突然停药","E.建议空腹服用以提高吸收"],ans:"C",exp:"高蛋白餐影响左旋多巴吸收，应避免同服。"},
    {type:"最佳选择题",q:"6. 患者，男，73岁，既往有前列腺增生病史，近期因“双侧肢体抖动、动作缓慢1年余，加重半年”入院。患者主诉：1年前出现休息时右手抖动，站立时较前费力，自行服用活血药物；半年前右手抖动时间延长，有时左手也抖动，与家人交流减少，自行服用补钙制剂。诊断结论：晚发型帕金森病。针对患者病情，宜选用的治疗药物是",opts:["A.司来吉兰","B.苯海索","C.复方左旋多巴","D.普拉克索","E.恩他卡朋"],ans:"C",exp:"晚发型帕金森病首选复方左旋多巴。"},
    {type:"最佳选择题",q:"7. 帕金森病患者用药后出现脚踝水肿、站立时出现头晕，偶有幻觉。最可能引起这些反应的药物是",opts:["A.苯海索","B.恩他卡朋","C.左旋多巴","D.普拉克索","E.金刚烷胺"],ans:"D",exp:"普拉克索可致脚踝水肿、体位性低血压和幻觉。"},
    {type:"最佳选择题",q:"8. 药师在指导帕金森病患者用药时，告知其“该药可能引起幻觉，最后一次服药不要晚于下午4点”。该药物最可能是",opts:["A.金刚烷胺","B.普拉克索","C.左旋多巴","D.恩他卡朋","E.苯海索"],ans:"A",exp:"金刚烷胺可致幻觉，宜下午4点前服用。"},
    {type:"最佳选择题",q:"9. 患者，女，70岁，有高血压病史，右手抖动，行走缓慢4年，诊断为帕金森病。服用复方左旋多巴治疗，症状一度好转后又反复加重，随后采用加大复方左旋多巴剂量，并加用苯海索。患者同时服用氨氯地平、缬沙坦等药物控制血压。近日出现运动症状波动，伴有异动症。导致该不良反应的药物是",opts:["A.缬沙坦","B.司来吉兰","C.苯海索","D.复方左旋多巴","E.氨氯地平"],ans:"D",exp:"复方左旋多巴长期使用可致运动波动和异动症。"},
    {type:"最佳选择题",q:"10. 药师在指导患者服用司来吉兰时，正确的说法是",opts:["A.每日两次，最好在早晨和中午服用","B.每日两次，早晚服用效果更佳","C.睡前服用可改善睡眠质量","D.餐后立即服用以减少胃肠刺激","E.任何时间服用均可，无需固定时间"],ans:"A",exp:"司来吉兰宜早晨和中午服用，避免晚间引起失眠。"},
    {type:"最佳选择题",q:"11. 通过抑制单胺氧化酶B，和左旋多巴合用可以延长左旋多巴作用时间，从而改善其剂末现象的药物是",opts:["A.恩他卡朋","B.金刚烷胺","C.司来吉兰","D.普拉克索","E.苯海索"],ans:"C",exp:"司来吉兰抑制MAO-B，延长左旋多巴作用。"},
    {type:"最佳选择题",q:"12. 单用无效、必须与左旋多巴联合使用的治疗帕金森病的药物是",opts:["A.多奈哌齐","B.司来吉兰","C.苯海索","D.恩他卡朋","E.阿米替林"],ans:"D",exp:"恩他卡朋单用无效，必须与左旋多巴合用。"},
    {type:"最佳选择题",q:"13. 下列关于帕金森病的用药指导与患者教育，说法错误的是",opts:["A.晚间服用司来吉兰+复方左旋多巴特别适用于治疗症状波动的病例","B.在疾病早期首选复方左旋多巴+恩他卡朋治疗，可能预防或延迟运动并发症的发生","C.对于认知功能减退的帕金森病患者，首选复方左旋多巴作为初始治疗药物","D.避免突然改变体位，起床、站立、转头等动作要缓慢","E.注意补充钙质，避免骨质疏松，可每天喝1杯牛奶或酸奶"],ans:"B",exp:"早期不首选复方左旋多巴+恩他卡朋。"},
    {type:"最佳选择题",q:"14. 患者，男，60岁，长期服用复方左旋多巴治疗帕金森病。为减轻左旋多巴引起的剂峰异动症，不宜采取的措施是",opts:["A.减少剂量同时加用恩他卡朋","B.减少剂量同时加用普拉克索","C.联合金刚烷胺","D.适当增加复方左旋多巴的每次给药剂量","E.若使用复方左旋多巴缓释剂，换用常释剂"],ans:"D",exp:"增加复方左旋多巴剂量会加重异动症。"},
    {type:"最佳选择题",q:"15. 患者，男，74岁，患帕金森病3年，药物治疗效果变差。医生发现其日常蛋白质摄入高，且服药时同时进食高蛋白食物。在治疗过程中，受蛋白质摄入影响大，需调整蛋白质摄入时间来保证效果的药物是",opts:["A.苯海索","B.金刚烷胺","C.恩他卡朋","D.复方左旋多巴","E.普拉克索"],ans:"D",exp:"复方左旋多巴受蛋白质摄入影响大。"},
    {type:"最佳选择题",q:"16. 以下针对帕金森病剂峰异动症的处理方法，说法错误的是",opts:["A.加用金刚烷胺","B.若患者是单用复方左旋多巴，可适当减少剂量，同时加用多巴胺受体激动剂","C.减少每次复方左旋多巴的剂量，若伴有剂末恶化可增加每日服药次数","D.不可加用非典型抗精神病药如氯氮平","E.若使用复方左旋多巴缓释剂，则应换用常释剂，避免缓释剂的累积效应"],ans:"D",exp:"可加用氯氮平治疗异动症。"},
    {type:"最佳选择题",q:"17. 以下关于帕金森病用药注意事项与患者教育的说法，错误的是",opts:["A.部分帕金森病患者会出现直立性低血压，表现为站立时血压骤降，引发头晕等症状","B.药物治疗是帕金森病最主要手段，患者需长期按剂量正确服药","C.帕金森病患者晚上应低蛋白饮食，白天适当增加蛋白质饮食","D.帕金森病患者容易便秘，饮食上要增加饮水量和高纤维素食物","E.帕金森病患者日常活动要注意安全，不宜驾车或操作机器"],ans:"C",exp:"应白天低蛋白饮食，晚上可适当增加蛋白质。"},
    {type:"配伍选择题",subs:[
      {q:"18. 患者，女，70岁，已在使用复方左旋多巴治疗，但症状波动明显。医生拟加用一种药物，需提醒患者，该药在胃肠道可与铁剂形成螯合物影响吸收，且必须与复方左旋多巴同服，单用无效。该药物是",opts:["A.普拉克索","B.左旋多巴","C.苯海索","D.司来吉兰","E.恩他卡朋"],ans:"E"},
      {q:"19. 患者，男，60岁，诊断为帕金森病。医生计划使用一种单胺氧化酶B型抑制剂，需特别提醒患者，该药应避免与氟西汀合用，以防引发5-羟色胺综合征。该药物是",opts:["A.普拉克索","B.左旋多巴","C.苯海索","D.司来吉兰","E.恩他卡朋"],ans:"D"},
      {q:"20. 患者，女，48岁，诊断为早发型帕金森病。医生希望为其选择一种在病程初期能有效控制症状，且远期症状波动和异动症风险较低的治疗。但需告知，该类药物可能导致体位性低血压、足踝部水肿。该药物是",opts:["A.普拉克索","B.左旋多巴","C.苯海索","D.司来吉兰","E.恩他卡朋"],ans:"A"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"21. 为提高药物吸收效率、保证疗效稳定，某帕金森病治疗药物应尽量空腹服用，并需严格避免与富含蛋白质的食物同餐，因为蛋白质会影响其在小肠的吸收和转运入脑。该药物是",opts:["A.恩他卡朋","B.帕罗西汀","C.左旋多巴","D.曲美他嗪","E.金刚烷胺"],ans:"C"},
      {q:"22. 某帕金森病治疗药物有引起幻觉、精神行为异常的风险。为降低此类中枢神经系统不良反应对夜间睡眠的影响，宜在下午4时前服用，避免睡前给药。该药物是",opts:["A.恩他卡朋","B.帕罗西汀","C.左旋多巴","D.曲美他嗪","E.金刚烷胺"],ans:"E"}
    ]},
    {type:"多项选择题",q:"23. 患者，男，78岁，同时患有帕金森病和闭角型青光眼。医生在为其制定抗帕金森病治疗方案时，需特别注意避免使用可能诱发或加重青光眼急性发作的药物有",opts:["A.苯海索","B.金刚烷胺","C.左旋多巴","D.普拉克索","E.司来吉兰"],ans:"AB",exp:"苯海索和金刚烷胺可能诱发或加重青光眼。"},
    {type:"多项选择题",q:"24. 一老年患者诊断为帕金森病，作为其慢病管理团队的一员，药师需为其提供全面的用药与生活指导。以下关于帕金森病患者综合管理的建议中，正确的有",opts:["A.白天可以低蛋白饮食，晚上可以适当增加蛋白质","B.应坚持适当的锻炼和日常活动","C.注意补充钙质，避免骨质疏松","D.需长期坚持按剂量正确服用药物","E.饮食上需注意增加饮水量"],ans:"ABCDE",exp:"以上均为帕金森病综合管理建议。"},

    // ===== 第5节 癫痫 =====
    {type:"最佳选择题",q:"1. 患者，男，35岁，诊断为癫痫，长期服用抗癫痫药物，近期出现走路不稳、头晕、看东西模糊的症状，同时家属发现其牙龈逐渐肥厚增生。该患者最可能服用的药物是",opts:["A.丙戊酸钠","B.卡马西平","C.苯妥英钠","D.左乙拉西坦","E.多奈哌齐"],ans:"C",exp:"苯妥英钠可致牙龈增生、共济失调。"},
    {type:"最佳选择题",q:"2. 患者，男，60岁，近期服用某种抗癫痫药治疗三叉神经痛，服药期间出现恶心、乏力、嗜睡，实验室检查提示血钠显著降低。同时，该药有导致严重皮肤反应和全身性过敏反应的风险。该患者最可能服用的药物是",opts:["A.加巴喷丁","B.卡马西平","C.丙戊酸钠","D.拉莫三嗪","E.托吡酯"],ans:"B",exp:"卡马西平可致低钠血症和严重皮肤反应。"},
    {type:"最佳选择题",q:"3. 在下列不良反应与药物的对应关系中，关联性错误的是",opts:["A.低钙血症、叶酸缺乏——苯巴比妥","B.齿龈增生——苯妥英钠","C.体重增加——丙戊酸钠","D.低钠血症、皮疹——卡马西平","E.认知障碍、低钠血症——苯巴比妥"],ans:"E",exp:"低钠血症多见于卡马西平，不是苯巴比妥。"},
    {type:"最佳选择题",q:"4. 患者，女，45岁，2年前因出现口吐白沫、意识变浅，二便失禁，在医生指导下进行抗癫痫药物治疗，症状得以控制。但一段时间后，患者出现脱发、体重增加、胃肠道功能紊乱。该患者最可能服用的药物是",opts:["A.左乙拉西坦","B.丙戊酸钠","C.苯巴比妥","D.奥卡西平","E.苯妥英钠"],ans:"B",exp:"丙戊酸钠可致脱发、体重增加、胃肠道紊乱。"},
    {type:"最佳选择题",q:"5. 患者，女，39岁，周末与朋友逛街时突然全身抽搐，口吐白沫，翻白眼，肌肉强直。救护车抵达后，随行医生根据起病时间初步诊断为癫痫持续状态，遂抬入救护车送往医院救治。入院后首选的处理措施为",opts:["A.肌注苯巴比妥100mg","B.口服地西泮10mg","C.肌注地西泮10mg","D.静注地西泮10mg","E.口服丙戊酸钠200mg"],ans:"D",exp:"癫痫持续状态首选静注地西泮。"},
    {type:"最佳选择题",q:"6. 患者，女，66岁，癫痫病史20年，2天前突然出现头晕，随即倒地，四肢抽搐，口吐白沫，紧急救治后，开始应用抗癫痫药物长期治疗。用药指导中需定期复查且应增加凝血功能检测的药物是",opts:["A.左乙拉西坦","B.卡巴拉汀","C.卡马西平","D.丙戊酸钠","E.咪达唑仑"],ans:"D",exp:"丙戊酸钠可影响凝血功能。"},
    {type:"最佳选择题",q:"7. 患者，女，孕8周，既往有癫痫病史，前来咨询癫痫与怀孕之间的相关影响。作为药师，应给予患者最合理的建议是",opts:["A.终止妊娠，因为癫痫具有遗传性","B.终止妊娠，因为抗癫痫药物的妊娠毒性大","C.维持妊娠，可以选择妊娠毒性较小的左乙拉西坦来治疗","D.维持妊娠，可以选择妊娠毒性较小的卡马西平来治疗","E.维持妊娠，怀孕期间加服烟酸来预防胎儿神经方面的不良反应"],ans:"C",exp:"妊娠期癫痫可选左乙拉西坦。"},
    {type:"配伍选择题",subs:[
      {q:"8. 患者，男，28岁，因癫痫开始长期服用抗癫痫药。在后续随访中，医生需监测其可能出现由该药诱导肝药酶活性而导致的代谢性并发症，如因加速维生素D代谢而引发的低钙血症，以及因影响叶酸代谢而导致的叶酸缺乏等。该药物是",opts:["A.地西泮","B.加巴喷丁","C.丙戊酸钠","D.左乙拉西坦","E.苯巴比妥"],ans:"E"},
      {q:"9. 患者，女，45岁，新诊断为癫痫，既往有“非酒精性脂肪性肝病”病史。医生在选药时需避免使用一种对肝药酶有广泛抑制作用，且本身有肝毒性风险，可能加重其肝功能损害的药物。需避免使用的药物是",opts:["A.地西泮","B.加巴喷丁","C.丙戊酸钠","D.左乙拉西坦","E.苯巴比妥"],ans:"C"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"10. 患者，女，38岁，癫痫病史，长期使用有效血药浓度为4~12μg/ml的抗癫痫药物，该药可能引起低钠血症、白细胞减少。该药物是",opts:["A.拉莫三嗪","B.丙戊酸钠","C.苯妥英钠","D.苯巴比妥","E.卡马西平"],ans:"E"},
      {q:"11. 患者，男，70岁，癫痫病史，长期使用有效血药浓度为10~20μg/ml的抗癫痫药物，该药可能引起共济失调、齿龈增生。该药物是",opts:["A.拉莫三嗪","B.丙戊酸钠","C.苯妥英钠","D.苯巴比妥","E.卡马西平"],ans:"C"}
    ]},

    // ===== 第6节 痴呆 =====
    {type:"最佳选择题",q:"1. 患者，女，60岁，因进行性记忆减退、定向力障碍被神经科诊断为阿尔茨海默病。她同时有长达20年的支气管哮喘病史，目前使用吸入剂控制，但仍有间歇性发作。考虑到该患者的呼吸系统状况，下列药物中，最适宜选择的是",opts:["A.加兰他敏","B.多奈哌齐","C.卡巴拉汀","D.帕罗西汀","E.美金刚"],ans:"E",exp:"美金刚对呼吸系统影响小，适合哮喘患者。"},
    {type:"最佳选择题",q:"2. 患者，男，75岁，因阿尔茨海默病开始服用美金刚治疗。美金刚的主要不良反应是",opts:["A.呼吸抑制","B.头晕、幻觉","C.心律不齐","D.血脂升高","E.血糖升高"],ans:"B",exp:"美金刚主要不良反应为头晕、幻觉。"},
    {type:"最佳选择题",q:"3. 有关老年痴呆患者的用药注意事项，说法错误的是",opts:["A.服用胆碱酯酶抑制剂期间应监测胃出血","B.多奈哌齐宜与NSAIDs合用","C.红霉素通过抑制肝药酶可使加兰他敏作用增强","D.服用碳酸氢钠可提高美金刚血药浓度，增强药效","E.服用氯化铵可加快美金刚排泄，降低药效"],ans:"B",exp:"多奈哌齐与NSAIDs合用增加胃出血风险，不宜合用。"},
    {type:"最佳选择题",q:"4. 患者，男，75岁，1个月前诊断为阿尔茨海默病，医师开具多奈哌齐片进行治疗。有关该患者的用药注意事项与患者教育，下列说法错误的是",opts:["A.多奈哌齐属于胆碱酯酶抑制剂","B.若患者后期出现明显的激越、幻觉等精神行为症状，常规使用抗精神病药物应作为首选方案","C.多奈哌齐主要作用是改善认知功能、延缓功能衰退，并不能阻止疾病的最终进展","D.在确保安全的前提下，应鼓励患者尽可能自己完成穿衣、进食等日常活动","E.漏服1次多奈哌齐应尽快补服，但若接近下次服药时间，则无需补服"],ans:"B",exp:"精神行为症状首选非药物治疗，抗精神病药不作为首选。"},
    {type:"最佳选择题",q:"5. 患者，女，69岁，新诊断为阿尔茨海默病，尝试口服加兰他敏片改善认知功能。下列药物中，可增加胃出血风险，患者应避免服用的药物是",opts:["A.山莨菪碱","B.美金刚","C.奥美拉唑","D.利福平","E.双氯芬酸"],ans:"E",exp:"双氯芬酸为NSAIDs，与加兰他敏合用增加胃出血风险。"},
    {type:"配伍选择题",subs:[
      {q:"6. 碳酸氢钠碱化尿液可使某一种改善认知功能的药物清除率下降，使其血药浓度升高。该药物是",opts:["A.苯海索","B.美金刚","C.卡巴拉汀","D.多奈单抗","E.地舒单抗"],ans:"B"},
