    {type:"最佳选择题",q:"甲是G省一家药品上市许可持有人，持有抗生素类药品M的药品注册证书。2026年5月，G省药品监督管理部门通过不良事件监测发现，药品M某批次产品存在严重质量缺陷，使用该药品可能引起严重健康危害，而甲未主动开展风险排查与召回工作。G省药品监督管理部门随即向甲下达责令召回通知书，要求其对该批次药品实施一级召回。关于本次一级召回的实施要求，说法正确的是",opts:["A.甲在收到责令召回通知书后，应当在1日内通知相关药品经营企业、使用单位停止销售和使用","B.甲应当在启动一级召回后7日内，将召回计划提交至G省药品监督管理部门备案","C.一级召回的药品，甲应当在1个月内完成召回工作，并向药监部门提交召回总结报告","D.甲实施一级召回的，无需每日向G省药品监督管理部门报告召回进展情况"],ans:"A",exp:"一级召回应在1日内通知相关单位停止销售和使用。"},
    {type:"最佳选择题",q:"关于乙未配合药品召回行为的说法，错误的是",opts:["A.乙收到召回通知后，应当立即停止销售该批次药品，通知上游供货方与下游购货方","B.乙无正当理由不配合召回工作的，药品监督管理部门可对其作出警告、罚款等行政处罚","C.乙应当协助甲收集药品M的不良反应信息，反馈药品安全隐患相关情况","D.乙未停止销售的行为不违反法规要求，仅需承担药品质量的连带责任"],ans:"D",exp:"乙未停止销售违反法规要求，需承担法律责任。"},
    {type:"最佳选择题",q:"甲生物制品研发企业研发上市了一款针对PDL-1靶点用于肿瘤免疫治疗的新药，并取得了该药品的药品注册证书。为提升该药品生产供应能力，甲计划在生产供应不足的情况下，同时委托乙药品生产企业生产，该新药销售由甲承担。作为该药品受托生产企业，乙的《药品生产许可证》分类码大写字母应当为",opts:["A.A","B.B","C.C","D.D"],ans:"C",exp:"接受委托的药品生产企业分类码为C。"},

    {type:"最佳选择题",q:"甲的下列行为不符合国家规定的是",opts:["A.甲聘请医药代表从事该抗肿瘤药的信息传递、沟通、反馈活动","B.甲与其医药代表签订劳动合同，并及时做好备案信息维护","C.甲就该抗肿瘤药的不良反应及时向疾病预防控制机构报告","D.甲委托具有生物制品经营范围的药品批发企业销售该抗肿瘤药"],ans:"C",exp:"不良反应应向药品监督管理部门报告，不是疾病预防控制机构。"},
    {type:"最佳选择题",q:"下列对于甲的要求，正确的是",opts:["A.甲委托乙生产的该药品上市销售前，应当经甲的质量受权人签字放行","B.经协议约定后，甲无须承担该药品流通环节的质量责任","C.经协议约定后，甲无须承担该药品受托生产的质量责任","D.甲从事该抗肿瘤药的生产活动应当经国家药品监督管理局许可"],ans:"A",exp:"上市放行应由持有人的质量受权人签字。"},
    {type:"最佳选择题",q:"甲机构是某口服瓶装液体制剂A的药品上市许可持有人，该药品出厂检验全部合格、包装原有材料已通过关联审评。近期在偏远山区配送途中，多次收到外包装完好、内瓶破损漏液、药液污染的客诉，经溯源确认系原有内包装抗压防震性能不足导致。甲机构拟全面更换高强度药用内包材，经评估该包材变更直接影响药品密封性、稳定性与运输安全，定性为药品上市后重大变更。关于该药品破损漏液相关质量责任，说法正确的是",opts:["A.甲作为持有人，须对药品生产、储存、运输、流通全供应链的质量安全承担主体责任","B.破损仅发生在末端配送运输环节，应由物流承运方全权担责","C.药品出厂放行合格，经营与配送环节产生的质量风险，甲可完全免责","D.甲仅对出厂检验放行前的药品质量负责，流通破损问题不属于持有人责任范围"],ans:"A",exp:"持有人对全供应链质量安全承担主体责任。"},
    {type:"最佳选择题",q:"甲决定更换A的包装材料。根据《药品上市后变更管理办法（试行）》，甲的做法正确的是",opts:["A.直接启动药品再注册流程，拿到再注册批件后方可更换包材","B.按法规提交药品补充申请，经国家药品监督管理部门审评批准之后，方可实施变更","C.报所在地省级药品监督管理部门备案后实施","D.先行自行更换新包材投产使用，变更完成后再向省级药品监督管理部门报备"],ans:"B",exp:"重大变更需提交补充申请，经批准后实施。"},
    {type:"最佳选择题",q:"甲为国内创新制药研发企业，自主立项研制一款全新化学新药，专门用于4~12岁儿童注意缺陷多动障碍临床治疗。该药品完整开展I、II、III期临床试验，临床数据显示疗效显著、安全性可控，属于国家鼓励的临床急需儿童专用治疗药。甲企业依规向国家药品监督管理局申请药品上市许可时，获批加快审评通道，2022年12月10日正式获批《药品注册证书》，取得药品上市许可。该药品加快上市注册程序属于",opts:["A.特别审批程序","B.优先审评审批程序","C.应急审批程序","D.附条件批准程序"],ans:"B",exp:"临床急需儿童专用药适用优先审评审批程序。"},
    {type:"最佳选择题",q:"关于甲作为该药品上市许可持有人的相关管理要求，说法错误的是",opts:["A.主动持续开展该药品上市后不良反应监测、长期安全性再评价","B.直接为受托生产企业乙制定其内部生产投料、车间质控、成品出厂放行的全套操作规程","C.可自行销售，也可委托具备对应经营范围、符合GSP管理要求的药品经营企业销售","D.严格落实年度报告制度，按时向所在地省级药品监督管理部门报送"],ans:"B",exp:"持有人不应直接为受托生产企业制定内部操作规程。"},
    {type:"最佳选择题",q:"下列属于该药品正规批准文号格式的是",opts:["A.国药准字H2022XXXX","B.国药准字Z2022XXXX","C.国药准字S2022XXXX","D.国药准字J2022XXXX"],ans:"A",exp:"化学药品批准文号格式为国药准字H+四位年号+四位顺序号。"},
    {type:"最佳选择题",q:"甲是E省一家中药饮片生产企业，《药品生产许可证》生产范围为中药饮片（净制、切制、炮炙），有效期至2027年8月20日。2026年1月，甲因企业战略调整，主动向原发证机关申请注销《药品生产许可证》。关于甲《药品生产许可证》注销的说法，不符合法规要求的是",opts:["A.甲主动申请注销《药品生产许可证》，原发证机关应当依法予以注销","B.若甲的《药品生产许可证》有效期届满未申请换发，原发证机关应当依法注销","C.甲的《药品生产许可证》注销后，仍可在原有生产范围内开展中药饮片生产活动","D.若甲的《药品生产许可证》依法被吊销，原发证机关应当依法办理注销手续"],ans:"C",exp:"许可证注销后不得继续生产。"},
    {type:"最佳选择题",q:"乙是E省一家生物制品上市许可持有人，持有破伤风人免疫球蛋白的药品注册证书，2026年3月，E省药品监督管理部门对乙开展监督检查，发现乙未按规定向省级药品监督管理部门提交上一年度的药品年度报告，且未按规定开展上市后风险管理相关工作。关于乙的年度报告制度与风险管理的说法，正确的是",opts:["A.乙应当每2年向E省药品监督管理部门提交药品年度报告","B.年度报告内容仅需包含药品生产销售情况，无需涵盖上市后研究与风险管理内容","C.乙作为药品上市许可持有人，应当建立药品上市后风险管理体系，主动开展风险监测与评估","D.乙未按规定提交年度报告的，药品监督管理部门仅可予以警告，不得作出罚款等行政处罚"],ans:"C",exp:"持有人应建立上市后风险管理体系。"},
    {type:"最佳选择题",q:"甲是F省一家药品上市许可持有人，持有降血糖化学药Z的药品注册证书，委托F省药品生产企业乙生产该药品，药品有效期为36个月。2026年4月，甲通过药品不良反应监测与上市后评价发现，该药品某批次产品因生产过程中投料偏差，导致有效成分含量低于国家药品标准规定，使用该药品可能导致患者血糖控制不佳，引起暂时的、可逆的健康危害。甲经风险评估后，决定对该批次药品实施主动召回，并向F省药品监督管理部门提交了召回计划。根据药品召回管理相关规定，甲对该批次药品实施的召回分级为",opts:["A.一级召回","B.二级召回","C.三级召回","D.四级召回"],ans:"B",exp:"可能引起暂时或可逆健康危害的，为二级召回。"},
    {type:"最佳选择题",q:"关于本次药品召回责任与义务的说法，错误的是",opts:["A.甲作为药品上市许可持有人，是本次药品召回的责任主体","B.乙应当配合甲实施召回，协助排查药品安全隐患","C.药品经营企业收到召回通知后，应当立即停止销售该批次药品，协助甲完成召回工作","D.若甲未主动实施召回，F省药品监督管理部门应当直接吊销甲的药品注册证书，再责令其召回"],ans:"D",exp:"应先责令召回，不是直接吊销注册证书。"},
    {type:"最佳选择题",q:"关于本次药品召回实施与后续处理的说法，符合法规要求的是",opts:["A.甲应当在启动召回后7日内，将召回计划提交至F省药品监督管理部门备案","B.甲对召回药品的处理记录，应当保存至少5年，且不少于药品有效期满后1年","C.该批次药品因含量低于标准，召回后可直接返工重新投料生产后上市销售","D.甲在实施召回过程中，无需向社会发布药品召回信息，仅需通知相关经营企业与使用单位"],ans:"B",exp:"记录保存至少5年且不少于药品有效期满后1年。"},
    {type:"最佳选择题",q:"甲是A省一家化学药品上市许可持有人，持有化学原料药X、化学药Y的药品注册证书；《药品生产许可证》生产范围为化学药、化学原料药，有效期至2029年9月15日。乙是B省一家药品生产企业，《药品生产许可证》生产范围为化学药，具备相应剂型的GMP符合性条件，有效期至2028年11月20日。甲因产能规划调整，拟委托乙生产其持有的化学药Y，双方签订了委托生产协议与质量协议，明确了双方在药品生产质量管理中的权利与义务。2026年3月，A省药品监督管理部门对甲开展飞行检查，发现甲未按规定对乙的生产质量管理体系开展定期审核，且化学药Y的某批生产记录部分内容缺失，记录仅保存至药品有效期满后1年。关于甲与乙委托生产行为的说法，正确的是",opts:["A.甲可同时委托乙生产原料药X与化学药Y，无需额外取得审批","B.甲是委托生产的化学药Y的质量责任主体","C.乙可根据生产需要，将化学药Y的部分生产工序再次委托给其他符合条件的生产企业","D.甲与乙签订委托协议后，即可正式启动化学药Y的委托生产工作"],ans:"B",exp:"持有人是委托生产药品的质量责任主体。"},
    {type:"最佳选择题",q:"关于甲的药品生产记录管理行为的说法，错误的是",opts:["A.化学药Y的生产记录应当真实、准确、完整、可追溯，不得缺失关键内容","B.若化学药Y有效期为2年，甲将其批生产记录保存至有效期满后1年，符合法规要求","C.甲应当建立并执行批生产记录管理制度，确保每批药品均有对应的批生产记录","D.批生产记录缺失的，药品监督管理部门可依据相关法规对甲作出行政处罚"],ans:"B",exp:"批生产记录应保存至药品有效期满后1年，但不得少于5年。"},
    {type:"最佳选择题",q:"关于甲《药品生产许可证》管理的说法，正确的是",opts:["A.甲拟变更企业名称，应当在变更前向原发证机关申请《药品生产许可证》许可事项变更","B.甲应当在2029年3月15日前向原发证机关申请换发《药品生产许可证》","C.若甲的营业执照被依法注销，其《药品生产许可证》可继续使用至有效期届满","D.甲新增生产范围，无需办理《药品生产许可证》变更，仅需向省级药品监督管理部门备案即可"],ans:"B",exp:"应在有效期届满前6个月申请换发。"},
    {type:"最佳选择题",q:"2024年5月，甲药品创新研究所（具备药品上市许可申请主体资格）成功研发一款用于治疗成人特发性肺纤维化的1类化学创新药，通过国家药品监督管理局药品审评中心审评审批，依法取得《药品注册证书》，正式成为该药品的上市许可持有人。关于甲、乙、丙的说法，错误的是",opts:["A.甲作为上市许可持有人，与受托生产企业乙共同承担该药品生产全过程的质量责任与风险管理责任","B.甲是该药品全生命周期质量安全的第一责任人","C.甲、乙、丙三方均需建立健全符合要求的药品质量保证体系与质量追溯体系","D.甲、乙、丙三方共同承担该药品经营环节的质量责任、不良反应监测责任及上市后风险管理责任"],ans:"A",exp:"持有人对药品全生命周期质量安全承担主要责任，不是与受托方共同承担。"},
    {type:"最佳选择题",q:"关于甲后续生产经营相关行为的合规性判断，正确的是",opts:["A.因市场供应需求扩大，甲在委托丙销售的基础上，可新增委托1家具备相应经营范围、符合GSP要求的药品经营企业承担该药品的销售与配送工作","B.为提升生产产能，甲在委托乙生产的基础上，可新增委托1家以中成药生产为主营业务、具备规模化生产能力的药品生产企业生产该化学创新药","C.为简化内部管理流程，甲可书面委托乙企业质量负责人全权履行该药品的质量管理、出厂放行及上市后风险管控职责","D.为保障药品检验公正性，甲可长期委托属地药品检验所承担该药品的全项质量检验、出厂放行及年度质量回顾分析工作"],ans:"A",exp:"可新增委托具备条件的药品经营企业销售。"}

},{
  name: "第八章 药品信息管理及消费者权益保护",
  questions: [
    // 第1节 药品说明书和包装标签管理
    {type:"最佳选择题",q:"药品内标签包装尺寸过小的，至少标注（ ）、规格、产品批号、药品通用名称等内容",opts:["A.适应症/功能主治","B.生产日期","C.有效期","D.用法用量"],ans:"C",exp:"内标签因包装尺寸过小无法全部标明内容的，至少应当标注药品通用名称、规格、产品批号、有效期等内容。"},
    {type:"最佳选择题",q:"药品的每个（ ）的包装必须按规定印有或贴有标签并附说明书",opts:["A.最小销售单元","B.外包装","C.大包装","D.内包装"],ans:"A",exp:"药品的每个最小销售单元的包装必须按照规定印有或贴有标签并附有说明书。"},
    {type:"最佳选择题",q:"根据药品说明书和标签管理规定，关于药品名称的使用，下列表述正确的是",opts:["A.药品通用名称在竖版标签中，应标于其右三分之一范围内","B.为增强辨识度，药品通用名称可采用斜体或阴影字体","C.商品名称可以与通用名称同行书写","D.药品商品名称的字体可以比通用名称大，但颜色不得更突出"],ans:"A",exp:"药品通用名称在竖版标签中应标于右三分之一范围内；不得使用斜体、阴影；商品名称不得与通用名称同行书写；商品名称字体不得大于通用名称字体的二分之一。"},
    {type:"最佳选择题",q:"根据《药品说明书和标签管理规定》，药品说明书中【药品名称】项的书写顺序，下列正确的",opts:["A.商品名称、英文名称、通用名称、汉语拼音","B.英文名称、通用名称、商品名称、汉语拼音","C.通用名称、汉语拼音、商品名称、英文名称","D.通用名称、商品名称、英文名称、汉语拼音"],ans:"C",exp:"药品名称项下依次为通用名称、汉语拼音、商品名称、英文名称。"},
    {type:"最佳选择题",q:"下列关于药品说明书的格式和书写要求中，正确的是",opts:["A.药品说明书的核准日期在药品说明书首页正上方标注","B.药品说明书的修改日期应书写在核准日期的下方","C.既可内服又可外用的中药、天然药物，需要标注外用标识","D.特殊药品的专用标识在药品说明书首页左上方标注"],ans:"B",exp:"核准日期在首页左上角，修改日期在核准日期下方；既可内服又可外用的中药可不标注外用标识；特殊药品专用标识在首页右上角。"},

    {type:"最佳选择题",q:"甲医疗机构为W省三甲综合医院，持有印鉴卡。执业医师王某，为甲医疗机构医生，为患者赵某开具处方，处方所列药品包括：硝苯地平缓释胶囊、氢氯噻嗪片等。乙为药品零售连锁企业门店，张某为注册在乙的执业药师。情形一：赵某持医疗机构处方前往乙购药。情形二：张某对处方进行审核，并提供对应的用药指导方案和建议。情形三：张某进行药品调配时发现，本店氢氯噻嗪片已经售完，但店中有同类药品，药品适应症与治疗目标相符，且价格更便宜，故建议赵某更换药品服用，赵某接受建议，并在乙药店购买了上述药品。情形四：王某，经甲医疗机构培训、考核合格，授予了麻醉药品和第一类精神药品的处方权，并为自己开具了三唑仑片。根据资料所示，背景材料中的药品购销、处方审核、用药指导等行为，说法无误的是",opts:["A.情形一、情形四","B.情形一、情形二","C.情形一、情形三","D.情形二、情形三"],ans:"B"},

    {type:"最佳选择题",q:"甲是一家在某省药品监督管理部门备案的药品网络交易第三方平台。乙是入驻在甲的一家药品零售企业，依法持有《药品经营许可证》，经营方式：零售（连锁门店），经营类别：处方药、甲类非处方药、乙类非处方药，经营范围：化学药、生物制品。丙是一家与甲签约的快递企业。乙应当填写“药品网络销售企业报告信息表”，向药品监督管理部门报告的信息不包括",opts:["A.网站名称","B.法定代表人","C.域名","D.应用程序名称"],ans:"B",exp:"报告信息不包括法定代表人。"},

    {type:"最佳选择题",q:"甲是A省药品批发企业；乙是B省药品零售连锁企业总部，旗下有数家直营门店；丙为乙旗下零售连锁门店，经营范围为化学药品制剂、中成药、中药饮片、生物制品；丁是C省药品零售企业（非连锁），经营类别为：甲类非处方药、乙类非处方药。2025年12月，药品监督管理部门实施监督检查过程中，发现下列情形：（1）甲企业仓库湿度为30%；（2）乙对外包装及封签完整的原料药实施不开箱检查；（3）丙配备一名中专学历中药饮片验收人员；（4）丁销售甲类非处方药时执业药师未在场。以上检查出现情形中，不符合规定的是",opts:["A.情形(1)、情形(3)","B.情形(2)、情形(3)","C.情形(1)、情形(4)","D.情形(2)、情形(4)"],ans:"C",exp:"仓库湿度30%不符合规定，销售甲类非处方药执业药师未在场不符合规定。"},

    {type:"最佳选择题",q:"某药品零售企业拟申请《药品经营许可证》，经营类别包括处方药、甲类非处方药、乙类非处方药。企业聘请执业药师张某担任质量负责人。关于药品零售许可审批的说法，正确的是",opts:["A.药品监督管理部门应当先核定经营范围","B.药品监督管理部门应当先核定经营类别","C.药品监督管理部门应当先核定经营地址","D.药品监督管理部门应当先核定经营条件"],ans:"B",exp:"应当先核定经营类别。"},

  name: "第二部分 综合分析题专项训练（法规）",
  questions: [
    {type:"最佳选择题",q:"1. 根据药品监督管理法规，结合题目提供的信息，关于药品销售行为的说法，正确的是",opts:["A.甲将甲钴胺片销售给丙，丙再直接销售并配送至丁的门店，丁的门店完成收货验收后向总部报告本次药品采购情况","B.甲将甲钴胺片销售给乙，乙再同时销售给丙和丁的总部","C.甲将甲钴胺片销售给乙，乙再销售给丙，丙再销售给丁的总部","D.甲将甲钴胺片销售给丙，丙再销售给丁的总部"],ans:"D",exp:"持有人可销售给批发企业，批发企业再销售给零售连锁总部。"},
    {type:"最佳选择题",q:"2. 丙在储存药品时未遵守《药品经营质量管理规范》，针对此情况丙可能受到的行政处罚不包括",opts:["A.情节严重的，处50万元以上200万元以下的罚款","B.没收违法所得，并处违法所得10倍以上20倍以下的罚款","C.责令限期改正，给予警告","D.逾期不改正的，处10万元以上50万元以下的罚款"],ans:"B",exp:"没收违法所得并处违法所得10倍以上20倍以下罚款是销售假药的处罚。"},
    {type:"最佳选择题",q:"3. 根据药品监督管理法规，结合题目提供的信息，关于委托销售与委托储存、运输行为的说法，正确的是",opts:["A.甲可以委托乙生产，同时委托乙销售甲钴胺片","B.甲可以委托丙销售，丙再委托丁销售甲钴胺片","C.甲可以委托丁销售，丁再委托丙储存运输甲钴胺片","D.甲可以委托丁销售，丁再委托丙销售甲钴胺片"],ans:"C",exp:"持有人可委托零售连锁企业销售，受托方不得再次委托销售，但可委托储存运输。"},
    {type:"最佳选择题",q:"4. 药品监督管理部门检查发现丁从个人处购进药品并销售，情节较轻，应当依法依规做出的处罚是",opts:["A.给予警告，责令限期改正；逾期不改正或者情节严重的，处1000元以上3000元以下的罚款","B.责令限期改正，予以警告；逾期不改正的，处10万元以上50万元以下的罚款","C.没收违法销售的药品和违法所得，并处违法销售药品货值金额10倍以上20倍以下的罚款，货值金额不足1万元的，按1万元计算","D.责令改正，没收违法购进的药品和违法所得，并处违法购进药品货值金额2倍以上10倍以下的罚款，货值金额不足5万元的，按5万元计算"],ans:"D",exp:"从非法渠道购进药品的处罚。"},
    {type:"最佳选择题",q:"5. 检查中发现乙销售中药饮片乌梢蛇的成分不符合规定，经查该批饮片是中药材专业市场商户自行包装后销售至乙。对于乙销售该中药饮片乌梢蛇的行为，应当定性为",opts:["A.销售劣药","B.销售假药","C.销售未规范炮制的炮制药品","D.销售未经批准生产的药品"],ans:"A",exp:"成分不符合规定属于劣药。"},
    {type:"最佳选择题",q:"6. 根据《药品管理法》，乙开架销售中药饮片的行为，药品监督管理部门可作出的行政处罚是",opts:["A.责令限期内整改，予以警告","B.没收违法销售药品和违法所得，责令停产停业整顿，并处违法销售药品的货值金额15倍以上30倍以下的罚款","C.吊销《药品经营许可证》","D.没收违法销售药品和违法所得，责令停产停业整顿，并处违法销售药品的货值10倍以上20倍以下的罚款"],ans:"A",exp:"违反GSP一般责令限期改正，给予警告。"},
    {type:"最佳选择题",q:"7. 药品零售企业乙向甲销售中药饮片的行为，药品监督管理部门可作出的行政处罚是",opts:["A.丙在三年内不得从事药品经营活动","B.责令限期整改，并处以5万至20万元的罚款","C.没收销售中药饮片川芎违法所得，并处以10万至50万元的罚款","D.没收销售中药饮片川芎违法所得，并处以50万至200万元的罚款"],ans:"C",exp:"未凭处方销售处方药的处罚。"},
    {type:"最佳选择题",q:"8. 药品监督管理部门监督检查发现，甲雇人从医疗机构凭处方获取某医疗机构制剂，拟通过微信群销售。针对上述情形，药品监督管理部门认定甲违法销售医疗机构制剂，按照《药品管理法》应当定性为",opts:["A.销售未经批准生产的药品","B.违反《药品经营质量管理规范》","C.从非法渠道购进药品","D.销售假药"],ans:"A",exp:"医疗机构制剂不得在市场上销售。"},

    {type:"最佳选择题",q:"15. 如果甲计划委托乙生产中药配方颗粒，下列说法正确的是",opts:["A.乙必须也具有中药配方颗粒的生产能力，甲才能委托乙生产中药配方颗粒","B.甲可以委托乙生产中药配方颗粒，但生产中药配方颗粒所用的中药饮片必须由甲提供","C.中药配方颗粒不得委托生产，如进行委托则甲会被并处药品货值金额10倍以上20倍以下的罚款，货值金额不足10万元的，按10万元计算","D.中药配方颗粒不得委托生产，如进行委托则甲被处以药品货值金额10倍以上20倍以下的罚款，货值金额不足1万元的，按1万元计算"],ans:"C",exp:"中药配方颗粒不得委托生产。"},
    {type:"最佳选择题",q:"16. 甲所生产中药配方颗粒在上市时应当",opts:["A.由M省药品监督管理部门颁发药品批准文号","B.向M省药品监督管理部门备案","C.获得国家药品监督管理部门颁发药品批准文号","D.向国家药品监督管理部门备案"],ans:"B",exp:"中药配方颗粒由省级药品监督管理部门备案。"},
    {type:"最佳选择题",q:"17. 如果甲计划委托乙生产中成药，甲与乙签订（ ），向（ ）省级药品监督管理部门申请办理药品生产许可证",opts:["A.委托协议和质量协议，M省","B.委托协议和质量协议，F省","C.生产协议和销售协议，M省","D.生产协议和销售协议，F省"],ans:"B",exp:"向受托方所在地省级药品监督管理部门申请。"},
    {type:"最佳选择题",q:"18. 甲将按照M省省标炮制的中药饮片销售至F省，但未向F省的省级药品监督管理部门备案，应承担（ ）的罚款",opts:["A.10万元以上50万元以下","B.15万元以上50万元以下","C.10万元以上30万元以下","D.15万元以上30万元以下"],ans:"A",exp:"未备案销售中药饮片，处10万-50万罚款。"},
    {type:"最佳选择题",q:"19. 乙在（ ）申请换发《药品经营许可证》，不会影响其许可证到期后继续经营药品",opts:["A.2025年4月1日","B.2025年8月1日","C.2025年9月29日","D.2025年10月1日"],ans:"A",exp:"应在有效期届满前6个月申请换发。"},
    {type:"最佳选择题",q:"20. 丙可以从甲采购的药品是",opts:["A.二氢埃托啡片","B.多烯磷脂酰胆碱胶囊","C.中药配方颗粒(甘草)","D.注射用A型肉毒毒素"],ans:"B",exp:"社区卫生服务中心只能采购普通药品。"},
    {type:"最佳选择题",q:"21. 2025年4月，药品监督管理部门对甲进行检查，发现甲将货值金额30万元的中药饮片放置于某物流仓库内（甲的《药品经营许可证》未载明该地址）。药品监督管理部门认为甲将中药饮片储存于法定仓库地址之外，但储存场所基本符合要求，依据相关规定决定从轻处罚，予以",opts:["A.责令其限期改正，但免予行政处罚","B.警告，并要求其限期改正","C.罚款150万元，并要求其限期改正","D.罚款450万元，并要求其限期改正"],ans:"B",exp:"从轻处罚为警告并限期改正。"},
    {type:"最佳选择题",q:"22. 关于该药品不良反应的定性与管理，说法正确的是",opts:["A.该药品不良反应不属于药品不良事件，无需上报","B.属于新的药品不良反应，应按规定上报","C.仅药师有权报告，医师无需报告","D.由国家药品监督管理局直接开展现场调查"],ans:"B",exp:"说明书未收录的为新的不良反应。"},
    {type:"最佳选择题",q:"23. 医疗机构应在获知该药品不良反应信息后，应当在",opts:["A.不迟于获知信息后的15日完成上报","B.不迟于获知信息后的1日完成上报","C.不迟于获知信息后的30日完成上报","D.必须立即上报"],ans:"A",exp:"新的严重不良反应15日内报告。"},
    {type:"最佳选择题",q:"24. 关于该案例中抗菌药物分级使用管理，说法正确的是",opts:["A.轻度呼吸道感染门诊开具非限制使用级抗菌药物，符合规定","B.门诊可直接开具特殊使用级抗菌药物","C.限制使用级抗菌药物首适用于轻度局部感染","D.非限制使用级抗菌药物必须会诊后使用"],ans:"A",exp:"门诊可开具非限制使用级抗菌药物。"},
    {type:"最佳选择题",q:"25. 关于该企业吸附破伤风疫苗的临床研发过程，下列说法正确的是",opts:["A.疫苗临床试验可由二级医疗机构实施，无需备案","B.企业生产环节仅需遵守《药品经营质量管理规范》","C.疫苗研发需遵循临床研究相关规定，生产需符合GMP要求","D.研发期间无需提交安全性更新报告"],ans:"C",exp:"疫苗研发需遵循临床研究规定，生产符合GMP。"},
    {type:"最佳选择题",q:"26. 省级药品监督管理部门应当坚持风险管理、全程管控原则，根据风险研判情况，针对药品生产企业制定年度检查计划并开展监督检查。对于材料中该药品研发企业的检查频率应为",opts:["A.每季度不少于1次","B.每半年不少于1次","C.每年不少于1次","D.每5年不少于1次"],ans:"C",exp:"疫苗生产企业每年至少检查1次。"},
    {type:"最佳选择题",q:"27. 下列围绕该企业的疫苗生产和上市后销售配送管理说法错误的是",opts:["A.经国家药品监督管理局批准疫苗可以委托生产","B.疫苗上市许可持有人可以自行配送疫苗，也可以委托疫苗配送单位配送疫苗","C.接受委托配送的企业不得再次委托","D.疫苗上市许可持有人可直接将疫苗供应给接种单位"],ans:"D",exp:"疫苗不得直接供应给接种单位。"},
    {type:"最佳选择题",q:"28. 药品A的批准文号格式正确的是",opts:["A.国药准字SJ202100XX","B.国药准字SC202100XX","C.国药准字S202100XX","D.国药准字J202100XX"],ans:"C",exp:"疫苗为生物制品，批准文号国药准字S+年号+顺序号。"},
    {type:"最佳选择题",q:"29. 关于该麻腮风疫苗采购与供应的说法，正确的是",opts:["A.该疫苗由C省人民政府通过省级公共资源交易平台组织采购","B.甲可直接向D省辖区内的接种单位供应该疫苗，无需通过","C.乙应当按照规定向辖区内接种单位供应该疫苗，不得收取任何费用","D.接种单位接种该疫苗时，仅可向受种者收取接种服务费，不得收取疫苗费用"],ans:"D",exp:"免疫规划疫苗免费接种，只收服务费。"},
    {type:"最佳选择题",q:"30. 关于甲委托丙配送疫苗的行为，符合法规要求的是",opts:["A.甲在D省行政区域内选取了3家具备资质的企业作为区域配送单位","B.丙因业务量激增，将部分疫苗配送业务再次委托给当地另一家符合条件的配送企业","C.甲与丙签订委托配送协议后，仅需向C省省级药品监督管理部门报告相关情况即可","D.甲应当对丙的冷链储存、运输条件及质量保障能力开展持续评估，确保配送过程符合法定要求"],ans:"D",exp:"持有人应对配送单位持续评估。"},
    {type:"最佳选择题",q:"31. 关于该疫苗储存、运输与记录管理的说法，错误的是",opts:["A.乙接收该疫苗时，应当索取本次运输、储存全过程温度监测记录，无记录的不得接收","B.甲对该疫苗的销售记录应当保存至疫苗有效期满后不少于3年备查","C.疫苗配送全过程应当处于规定的冷链环境中，不得脱离冷链运输、储存","D.丙应当建立真实、准确、完整的疫苗配送记录，保存至疫苗有效期满后不少于5年备查"],ans:"B",exp:"销售记录应保存至有效期满后不少于5年。"},
    {type:"最佳选择题",q:"32. 根据药品说明书管理规定，关于该药店“阿莫西林胶囊”说明书书写，正确的是",opts:["A.【药品名称】项的书写顺序符合规定","B.【禁忌】应当列出该药品不能应用的各种情况","C.【功能主治】表达正确","D.说明书中无需列出【孕妇及哺乳期妇女用药】"],ans:"B",exp:"禁忌应列出不能应用的各种情况。"},
    {type:"最佳选择题",q:"33. 关于该药品外包装标签上通用名称的印刷，结合材料中的情况，下列说法正确的是",opts:["A.该药品通用名称使用浅蓝色字体，符合要求","B.该药品通用名称可以使用斜体字","C.该药品通用名称为横版标签，在上三分之一范围内标出","D.该药品通用名称的字体颜色与背景形成反差即可，对颜色无特殊要求"],ans:"C",exp:"横版标签通用名称在上三分之一范围内标出。"},
    {type:"最佳选择题",q:"34. 结合材料关于该药店在执业药师的描述中的情况，下列说法正确的是",opts:["A.该药店的做法符合规定，因为执业药师外出培训属于正当理由，可由营业员临时代行审核职责","B.该药店的做法不符合规定，执业药师不在岗时应当挂牌告知，并暂停销售处方药","C.该药店的做法不符合规定，但只需事后由执业药师补签处方审核记录即可","D.该药店的做法符合规定，因为处方药销售只需核对处方，无需执业药师审核"],ans:"B",exp:"执业药师不在岗应挂牌告知并暂停销售处方药。"},
    {type:"最佳选择题",q:"35. 关于上述药品包装标签和说明书的管理，下列说法错误的是",opts:["A.处方药“艾司唑仑片”的包装上应当印有国家药品监督管理局规定的精神药品专用标志","B.含麻黄碱类复方制剂的说明书右上角标注“红色OTC”","C.复方甘草片的包装上无特殊药品标注","D.处方药“阿奇霉素片”的说明书标题下方应当注明“请仔细阅读说明书并在医师指导下使用”"],ans:"B",exp:"含麻黄碱类复方制剂若为处方药不标注红色OTC。"},
    {type:"最佳选择题",q:"36. 关于“全都有药品零售企业”在微信公众号发布的含麻黄碱类复方制剂广告，结合材料内容，下列说法正确的是",opts:["A.该广告可以在微信公众号发布，但应当显著标明“本广告仅供医学药学专业人士阅读”","B.该广告内容不可以通过微信公众号发布此药品的广告","C.该广告附有患者服药后笑容满面的照片，属于合法的广告表现形式","D.该广告未标注广告批准文号，但因微信公众号属于自媒体，可免予标注"],ans:"B",exp:"处方药广告不得在大众媒介发布。"},
    {type:"最佳选择题",q:"37. 关于上述药品购销过程中的资质审核与票据管理，结合材料中的情况，下列说法正确的是",opts:["A.“郑小前医药公司”作为批发企业，只需对“全都有药品零售企业”的药品经营许可证进行审核，无需审核其采购人员身份","B.“复方甘草片”的随货同行单未加盖供货单位出库专用章，属于违反药品经营质量管理规范的行为，应当拒收","C.“艾司唑仑片”的销售票据与物流信息不一致，但因其属于第二类精神药品，可允许适当差异","D.“郑小前医药公司”发现“全都有药品零售企业”的采购资质过期，仍可继续销售，但需在事后补办审核手续"],ans:"B",exp:"随货同行单未加盖出库专用章应拒收。"},
    {type:"最佳选择题",q:"38. 甲取得的该血液制品注册证书的审批部门及有效期分别为",opts:["A.国家药品监督管理局；5年","B.省级药品监督管理部门；5年","C.国家药品监督管理局；3年","D.省级药品监督管理部门；3年"],ans:"A",exp:"血液制品注册证书由国家药品监督管理局审批，有效期5年。"},
    {type:"最佳选择题",q:"39. 对甲扩建该血液制品生产厂区进行立项审查的部门为",opts:["A.省级药品监督管理部门","B.国家卫生健康主管部门","C.省级卫生健康主管部门","D.国家药品监督管理局"],ans:"A",exp:"省级药品监督管理部门立项审查。"},
    {type:"最佳选择题",q:"40. 下列关于甲欲委托乙生产该血液制品的说法中，正确的是",opts:["A.乙在具备血液制品生产范围且符合药品生产质量管理规范的情况下，甲方可委托乙生产该血液制品","B.甲不得委托乙生产该产品","C.经甲所在地省级药品监督管理部门批准后，甲方可委托乙生产该血液制品","D.药品上市许可持有人不得委托他人生产药品，因此，甲不得委托乙生产该血液制品"],ans:"B",exp:"血液制品不得委托生产。"},
    {type:"最佳选择题",q:"41. 下列药品中，属于甲可以经营的药品是",opts:["A.疫苗","B.中药饮片","C.含可待因复方口服液体制剂","D.注射用A型肉毒毒素"],ans:"C",exp:"甲可经营第二类精神药品，含可待因复方口服液体制剂属于第二类精神药品。"},
    {type:"最佳选择题",q:"42. 下列关于甲向有关部门申请变更经营范围的说法中，正确的是",opts:["A.甲应向所在地省级药品监督管理部门申请变更","B.甲申请的变更属于《药品经营许可证》的许可事项变更","C.重新核发后的甲的《药品经营许可证》的编号格式可能为“川BBxxxxxxxxx”","D.甲申请的变更可实施告知承诺制审批"],ans:"B",exp:"经营范围变更属于许可事项变更。"},
    {type:"最佳选择题",q:"43. 下列关于甲经营第二类精神药品管理的说法中，错误的是",opts:["A.甲不得陈列第二类精神药品","B.第二类精神药品每张处方一般不得超过7日常用量","C.甲不得采购第二类精神药品，应由甲的总部统一采购并配送至甲","D.甲应凭医师开具的处方向未成年人销售第二类精神药品"],ans:"D",exp:"不得向未成年人销售第二类精神药品。"},
    {type:"最佳选择题",q:"44. 下列关于中药饮片附子的管理说法中，错误的是",opts:["A.储存环节实行双人双锁保管","B.生产记录应保存5年备查","C.包装上要印有突出的毒性药品标志","D.根据市场需求，按省区确定2~3个定点企业生产"],ans:"D",exp:"附子应全国集中统一定点生产。"},
    {type:"最佳选择题",q:"45. 下列关于甲自行炮制A中药饮片的说法，正确的是",opts:["A.甲不得自行炮制A中药饮片，但可以采购功能相近的中药饮片代替","B.甲可以自行炮制A中药饮片，但需经省级药品监督管理部门批准","C.甲可以自行炮制A中药饮片，但需向省级药品监督管理部门备案","D.甲可以自行炮制A中药饮片，但需经国家药品监督管理部门批准"],ans:"C",exp:"医疗机构炮制中药饮片应向省级药品监督管理部门备案。"},
    {type:"最佳选择题",q:"46. 下列关于雄黄的管理说法中，正确的是",opts:["A.雄黄属于医疗用毒性药品，处方保存2年","B.雄黄属于医疗用毒性药品，每次处方剂量不得超过2日极量","C.雄黄属于麻醉药品，处方保存3年","D.雄黄属于精神药品，处方保存2年"],ans:"B",exp:"医疗用毒性药品每张处方不得超过2日极量。"},

var autoNext=(mode===true);var progress=document.createElement('div');progress.className='progress-text';progress.textContent=(currentQuestionIndex+1)+' / '+flat.length;bar.appendChild(progress);var prevBtn=document.createElement('button');prevBtn.className='next-btn';prevBtn.textContent='上一题';prevBtn.disabled=(currentQuestionIndex===0);prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};bar.appendChild(prevBtn);var nextBtn=document.createElement('button');nextBtn.className='next-btn';nextBtn.textContent=autoNext?'即将跳转…':'下一题';nextBtn.disabled=autoNext;nextBtn.onclick=function(){currentQuestionIndex++;renderOneQuestion();};bar.appendChild(nextBtn);document.body.appendChild(bar);}}function buildQuestion(qText,opts,ans,exp){return renderOneQuestionForOld(qText,opts,ans,exp);}
function renderOneQuestionForOld(qText,opts,ans,exp){var wrap=document.createElement('div');var title=document.createElement('div');title.className='q-title';title.textContent=qText;wrap.appendChild(title);var ansArr=ans.split('');var isMulti=ansArr.length>1;var selected=[];for(var i=0;i<opts.length;i++){(function(opt){var btn=document.createElement('button');btn.className='option';btn.textContent=opt;var letter=opt.charAt(0);btn.onclick=function(){if(btn.classList.contains('disabled'))return;if(isMulti){var idx=selected.indexOf(letter);if(idx===-1){selected.push(letter);btn.style.background='#d0e3ff';btn.style.borderColor='#4a90e2';}else{selected.splice(idx,1);btn.style.background='';btn.style.borderColor='';}}else{judge([letter]);}};wrap.appendChild(btn);})(opts[i]);}if(isMulti){var submitBtn=document.createElement('button');submitBtn.textContent='提交答案';submitBtn.style.cssText='margin-top:10px;padding:10px 20px;background:#4a90e2;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;';submitBtn.onclick=function(){if(selected.length===0){alert('请至少选择一个选项');return;}judge(selected);submitBtn.disabled=true;submitBtn.style.background='#c5d5ea';submitBtn.style.cursor='not-allowed';};wrap.appendChild(submitBtn);}function judge(chosen){var allOpts=wrap.querySelectorAll('.option');var isCorrect=false;if(isMulti){if(chosen.length===ansArr.length){var sc=chosen.slice().sort().join('');var sa=ansArr.slice().sort().join('');isCorrect=(sc===sa);}}else{isCorrect=ansArr.indexOf(chosen[0])!==-1;}if(isCorrect){correct++;for(var m=0;m<allOpts.length;m++){if(ansArr.indexOf(allOpts[m].textContent.charAt(0))!==-1){allOpts[m].classList.add('correct');allOpts[m].style.background='';allOpts[m].style.borderColor='';}}}else{for(var n=0;n<allOpts.length;n++){var letter=allOpts[n].textContent.charAt(0);if(chosen.indexOf(letter)!==-1&&ansArr.indexOf(letter)===-1){allOpts[n].classList.add('wrong');}if(ansArr.indexOf(letter)!==-1){allOpts[n].classList.add('correct');}allOpts[n].style.background='';allOpts[n].style.borderColor='';}}for(var p=0;p<allOpts.length;p++)allOpts[p].classList.add('disabled');answered++;document.getElementById('stats').textContent='已答 '+answered+' 题，正确 '+correct+' 题';if(exp){var expDiv=wrap.querySelector('.explanation');if(expDiv)expDiv.classList.add('show');}}if(exp){var expDiv=document.createElement('div');expDiv.className='explanation';expDiv.textContent='解析：'+exp;wrap.appendChild(expDiv);}return wrap;}
